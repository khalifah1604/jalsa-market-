<!DOCTYPE html>
<html lang="en" data-theme="dark" data-textsize="md">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jalsa Market — Discover. Connect. Shop at Jalsa.</title>
<meta name="description" content="Jalsa Market — the year-round marketplace for Jalsa vendors and customers. Discover vendors, browse products, preorder and connect on WhatsApp." />
<meta name="theme-color" content="#101310" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./jalsa%20logo.png" type="image/png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#101310; --bg2:#191E1A; --surface:#222823; --surface2:#2A312B;
  --green:#23864B; --green-hi:#2C9E5A; --green-soft:rgba(35,134,75,.14);
  --text:#FFFFFF; --muted:#A0A7A1; --border:#2C332D; --border-soft:#242A25;
  --danger:#C4453B; --danger-soft:rgba(196,69,59,.12);
  --warn:#C9922E; --warn-soft:rgba(201,146,46,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  --radius:16px; --radius-sm:10px; --radius-lg:22px;
  --maxw:1180px;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --header-h:60px; --tabbar-h:64px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme="light"]{
  --bg:#FFFFFF; --bg2:#F5F7F5; --surface:#FFFFFF; --surface2:#F0F3F0;
  --text:#171B18; --muted:#68716A; --border:#E6EAE6; --border-soft:#EFF2EF;
  --green-soft:rgba(35,134,75,.10);
  --shadow:0 1px 2px rgba(16,19,16,.05), 0 8px 24px rgba(16,19,16,.06);
}
html[data-textsize="lg"]{ font-size:17.5px; }
html[data-textsize="xl"]{ font-size:19px; }
html{ font-size:16px; -webkit-text-size-adjust:100%; }

/* ============================================================
   2. RESET / BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-body); font-size:.95rem; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  transition:background .25s var(--ease), color .25s var(--ease);
}
img{ max-width:100%; display:block; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; cursor:pointer; padding:0; }
a{ color:inherit; text-decoration:none; }
h1,h2,h3,h4{ margin:0; font-weight:600; letter-spacing:-.015em; }
p{ margin:0; }
::selection{ background:var(--green-soft); }
:focus-visible{ outline:2px solid var(--green); outline-offset:2px; border-radius:6px; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ============================================================
   3. TYPE
   ============================================================ */
.display{ font-family:var(--font-display); font-weight:400; letter-spacing:-.01em; line-height:1.1; }
.section-title{ font-size:1.06rem; font-weight:600; letter-spacing:-.02em; }
.sub{ color:var(--muted); font-size:.82rem; }
.tiny{ font-size:.72rem; letter-spacing:.04em; text-transform:uppercase; font-weight:600; color:var(--muted); }

/* ============================================================
   4. LAYOUT
   ============================================================ */
.container{ width:100%; max-width:var(--maxw); margin:0 auto; padding:0 18px; }
.section{ padding:22px 0 6px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
.section-head .link{ font-size:.82rem; color:var(--green); font-weight:600; white-space:nowrap; }
.stack{ display:flex; flex-direction:column; gap:14px; }
.row{ display:flex; align-items:center; gap:10px; }
.row-between{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.hide{ display:none !important; }

/* ============================================================
   5. BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:44px; padding:0 18px; border-radius:12px; font-size:.86rem; font-weight:600;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  transition:transform .12s var(--ease), background .18s var(--ease), border-color .18s var(--ease), opacity .18s;
  white-space:nowrap; user-select:none;
}
.btn:active{ transform:scale(.975); }
.btn[disabled]{ opacity:.5; pointer-events:none; }
.btn-primary{ background:var(--green); border-color:var(--green); color:#fff; }
.btn-primary:hover{ background:var(--green-hi); border-color:var(--green-hi); }
.btn-ghost{ background:transparent; border-color:var(--border); }
.btn-ghost:hover{ background:var(--surface); }
.btn-danger{ background:var(--danger-soft); border-color:transparent; color:#E0705F; }
.btn-block{ width:100%; }
.btn-sm{ height:36px; padding:0 13px; font-size:.79rem; border-radius:10px; }
.btn-lg{ height:50px; font-size:.92rem; border-radius:14px; }
.btn svg{ width:18px; height:18px; flex-shrink:0; stroke:currentColor; fill:none; }
.btn-sm svg{ width:15px; height:15px; }
.btn-lg svg{ width:20px; height:20px; }

.icon-btn{
  width:40px; height:40px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center;
  color:var(--text); position:relative; transition:background .18s var(--ease);
}
.icon-btn:hover{ background:var(--surface); }
.icon-btn svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

/* ============================================================
   6. SPLASH
   ============================================================ */
#splash{
  position:fixed; inset:0; z-index:9000; display:grid; place-items:center;
  background:#101310; transition:opacity .55s var(--ease), visibility .55s;
}
#splash.gone{ opacity:0; visibility:hidden; }
.splash-inner{ display:flex; flex-direction:column; align-items:center; gap:20px; }
.splash-mark{ width:88px; height:88px; animation:breathe 2.6s var(--ease) infinite; }
.splash-word{ font-family:var(--font-display); font-size:1.9rem; color:#fff; letter-spacing:.01em; }
.splash-tag{ font-size:.72rem; letter-spacing:.22em; text-transform:uppercase; color:#6E7A70; font-weight:600; }
.splash-dots{ display:flex; gap:5px; margin-top:6px; }
.splash-dots i{ width:5px; height:5px; border-radius:50%; background:#2C9E5A; opacity:.35; animation:dot 1.4s ease-in-out infinite; }
.splash-dots i:nth-child(2){ animation-delay:.18s; }
.splash-dots i:nth-child(3){ animation-delay:.36s; }
@keyframes breathe{ 0%,100%{ transform:scale(1); opacity:.92 } 50%{ transform:scale(1.055); opacity:1 } }
@keyframes dot{ 0%,100%{ opacity:.25; transform:translateY(0) } 50%{ opacity:1; transform:translateY(-3px) } }

/* ============================================================
   7. AUTH / WELCOME
   ============================================================ */
#auth{ min-height:100dvh; display:flex; flex-direction:column; }
.auth-hero{ padding:44px 0 26px; text-align:center; }
.auth-hero .mark{ width:60px; height:60px; margin:0 auto 18px; }
.auth-hero h1{ font-family:var(--font-display); font-size:2.1rem; font-weight:400; line-height:1.08; }
.auth-hero p{ color:var(--muted); font-size:.9rem; margin-top:10px; max-width:32ch; margin-inline:auto; }
.auth-body{ flex:1; padding-bottom:34px; }
.choice{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  padding:18px; border-radius:var(--radius); border:1px solid var(--border);
  background:var(--surface); transition:border-color .18s var(--ease), transform .12s var(--ease), background .18s;
}
.choice:hover{ border-color:var(--green); }
.choice:active{ transform:scale(.99); }
.choice .ico{ width:44px; height:44px; border-radius:12px; background:var(--green-soft); display:grid; place-items:center; flex:0 0 auto; }
.choice .ico svg{ width:22px; height:22px; stroke:var(--green); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.choice h3{ font-size:.98rem; }
.choice p{ color:var(--muted); font-size:.79rem; margin-top:2px; }
.choice .arrow{ margin-left:auto; color:var(--muted); }

/* ============================================================
   8. FORMS
   ============================================================ */
.field{ display:flex; flex-direction:column; gap:7px; }
.label{ font-size:.78rem; font-weight:600; color:var(--muted); letter-spacing:.01em; }
.input,.select,.textarea{
  width:100%; border:1px solid var(--border); color:var(--text);
  border-radius:12px; padding:12px 14px; font-size:.9rem; transition:border-color .18s var(--ease), background-color .18s;
  -webkit-appearance:none; -moz-appearance:none; appearance:none;
}
.input,.textarea{ background-color:var(--bg2); }
select, .select{
  background-color:var(--bg2) !important;
  background-image:none !important;
  padding-right:14px;
  cursor:pointer;
}
html[data-theme="light"] .input,html[data-theme="light"] .textarea{ background-color:#fff; }
html[data-theme="light"] select,html[data-theme="light"] .select{
  background-color:#fff !important;
  background-image:none !important;
}
.input::placeholder,.textarea::placeholder{ color:var(--muted); opacity:.72; }
.input:focus,.textarea:focus{ outline:none; border-color:var(--green); background-color:var(--surface); }
select:focus,.select:focus{ outline:none; border-color:var(--green); }
.textarea{ min-height:96px; resize:vertical; line-height:1.55; }
.field.has-error .input, .field.has-error .select, .field.has-error select, .field.has-error .textarea{
  border-color:var(--danger) !important; background-color:var(--danger-soft) !important;
}
.form-grid{ display:grid; gap:14px; }
@media(min-width:640px){ .form-grid.two{ grid-template-columns:1fr 1fr; } }
.check{ display:flex; align-items:flex-start; gap:11px; cursor:pointer; padding:12px 0; }
.check input{ appearance:none; width:20px; height:20px; flex:0 0 auto; border:1.5px solid var(--border); border-radius:6px; background:var(--bg2); margin:1px 0 0; position:relative; cursor:pointer; transition:.18s var(--ease); }
.check input:checked{ background:var(--green); border-color:var(--green); }
.check input:checked::after{ content:''; position:absolute; left:6px; top:2px; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(43deg); }
.check span{ font-size:.82rem; color:var(--muted); line-height:1.5; }
.field-error{ color:#E0705F; font-size:.8rem; line-height:1.45; padding:10px 14px; border-radius:10px; background:var(--danger-soft); border:1px solid rgba(196,69,59,.3); }

/* ============================================================
   9. APP SHELL
   ============================================================ */
#app{ min-height:100dvh; display:flex; flex-direction:column; padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }
.app-header{
  position:sticky; top:0; z-index:100; background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--border-soft);
}
.header-inner{ height:var(--header-h); display:flex; align-items:center; gap:10px; }
.brand{ display:flex; align-items:center; gap:9px; min-width:0; }
.brand .mark{ width:30px; height:30px; flex:0 0 auto; }
.brand-text{ display:flex; flex-direction:column; min-width:0; }
.brand-name{ font-size:.9rem; font-weight:700; letter-spacing:-.02em; line-height:1.15; }
.brand-greet{ font-size:.71rem; color:var(--muted); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.header-actions{ margin-left:auto; display:flex; align-items:center; gap:2px; }
.cart-dot{
  position:absolute; top:4px; right:4px; min-width:17px; height:17px; padding:0 4px; border-radius:9px;
  background:var(--green); color:#fff; font-size:.63rem; font-weight:700; display:grid; place-items:center; line-height:1;
}
.avatar{
  width:32px; height:32px; border-radius:50%; background:var(--green-soft); color:var(--green);
  display:grid; place-items:center; font-size:.78rem; font-weight:700; flex:0 0 auto;
}

/* Tab bar */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:120;
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border-soft);
  display:flex; align-items:stretch;
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--muted); font-size:.63rem; font-weight:600; letter-spacing:.01em; position:relative;
  transition:color .18s var(--ease); padding:0 2px;
}
.tab svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; transition:transform .18s var(--ease); }
.tab.active{ color:var(--green); }
.tab.active svg{ transform:translateY(-1px); }
.tab .tab-badge{
  position:absolute; top:8px; left:calc(50% + 6px); min-width:16px; height:16px; padding:0 4px;
  border-radius:8px; background:var(--green); color:#fff; font-size:.6rem; font-weight:700; display:grid; place-items:center;
}
@media(min-width:900px){
  #app{ padding-bottom:0; }
  .tabbar{ position:sticky; top:0; order:-1; height:auto; border-top:0; border-bottom:1px solid var(--border-soft); padding:0; backdrop-filter:none; background:var(--bg); }
  .tabbar{ max-width:none; }
  .tabbar-wrap{ width:100%; max-width:var(--maxw); margin:0 auto; display:flex; padding:0 18px; gap:4px; }
  .tab{ flex:0 0 auto; flex-direction:row; gap:8px; height:52px; padding:0 14px; font-size:.82rem; }
  .tab .tab-badge{ position:static; margin-left:2px; }
  .tab.active{ color:var(--green); }
}

/* ============================================================
   10. SEARCH
   ============================================================ */
.searchbar{ position:relative; }
.searchbar svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:var(--muted); fill:none; stroke-width:1.8; stroke-linecap:round; pointer-events:none; }
.searchbar input{
  width:100%; height:46px; padding:0 16px 0 42px; border-radius:14px;
  background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:.88rem;
  transition:border-color .18s var(--ease);
}
.searchbar input::placeholder{ color:var(--muted); opacity:.8; }
.searchbar input:focus{ outline:none; border-color:var(--green); }

/* ============================================================
   11. BANNERS
   ============================================================ */
.event-banner{
  border:1px solid var(--border); border-radius:var(--radius); padding:15px 16px;
  background:linear-gradient(135deg, var(--green-soft), transparent 62%), var(--surface);
  display:flex; align-items:center; gap:14px;
}
.event-banner .eb-body{ min-width:0; flex:1; }
.event-banner h4{ font-size:.9rem; }
.event-banner p{ font-size:.76rem; color:var(--muted); margin-top:2px; }
.countdown{ display:flex; gap:6px; margin-top:10px; }
.countdown div{ background:var(--bg2); border:1px solid var(--border); border-radius:9px; padding:5px 9px; text-align:center; min-width:44px; }
.countdown b{ display:block; font-size:.92rem; font-weight:700; line-height:1.1; }
.countdown small{ font-size:.57rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.notice{
  display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px;
  background:var(--warn-soft); color:#DCA94B; font-size:.79rem; line-height:1.5;
}
.notice.info{ background:var(--green-soft); color:var(--green); }
.notice svg{ width:17px; height:17px; flex:0 0 auto; margin-top:1px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; }

/* ============================================================
   12. CATEGORIES
   ============================================================ */
.cat-row{ display:flex; gap:9px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; -ms-overflow-style:none; }
.cat-row::-webkit-scrollbar{ display:none; }
.cat-chip{
  flex:0 0 auto; display:flex; align-items:center; gap:8px; height:40px; padding:0 15px;
  border-radius:11px; border:1px solid var(--border); background:var(--surface);
  font-size:.81rem; font-weight:500; white-space:nowrap; transition:.18s var(--ease);
}
.cat-chip:hover{ border-color:var(--green); }
.cat-chip.active{ background:var(--green); border-color:var(--green); color:#fff; font-weight:600; }
.chip-count{
  display:inline-grid; place-items:center; min-width:20px; height:19px; padding:0 5px;
  border-radius:9px; background:var(--green-soft); color:var(--green);
  font-size:.66rem; font-weight:700; line-height:1;
}
.cat-chip.active .chip-count{ background:rgba(255,255,255,.2); color:#fff; }

/* ============================================================
   13. HORIZONTAL SCROLLERS
   ============================================================ */
.hscroll{ display:flex; gap:13px; overflow-x:auto; padding:2px 0 8px; scroll-snap-type:x mandatory; scrollbar-width:none; -ms-overflow-style:none; }
.hscroll::-webkit-scrollbar{ display:none; }
.hscroll > *{ scroll-snap-align:start; }

.vendor-card{
  flex:0 0 232px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
  background:var(--surface); transition:border-color .2s var(--ease), transform .14s var(--ease);
}
.vendor-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:13px; }
.vendor-grid .vendor-card{ flex:none; width:100%; }
@media(min-width:600px){ .vendor-grid{ grid-template-columns:repeat(3,1fr); } }
@media(min-width:900px){ .vendor-grid{ grid-template-columns:repeat(4,1fr); gap:16px; } }
.vendor-card:hover{ border-color:var(--green); }
.vendor-card:active{ transform:scale(.99); }
.vc-media{ height:92px; background:var(--bg2); position:relative; overflow:hidden; }
.vc-media img{ width:100%; height:100%; object-fit:cover; }
.vc-logo{
  position:absolute; left:14px; bottom:-19px; width:44px; height:44px; border-radius:12px;
  border:2px solid var(--surface); background:var(--bg2); object-fit:cover; overflow:hidden;
  display:grid; place-items:center; font-weight:700; color:var(--green); font-size:.9rem;
}
.vc-body{ padding:25px 14px 14px; }
.vc-body h4{ font-size:.88rem; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vc-meta{ font-size:.72rem; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

/* ============================================================
   14. PRODUCT GRID
   ============================================================ */
.product-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:13px; }
@media(min-width:600px){ .product-grid{ grid-template-columns:repeat(3,1fr); } }
@media(min-width:900px){ .product-grid{ grid-template-columns:repeat(4,1fr); gap:16px; } }

.product-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; position:relative; transition:border-color .2s var(--ease), transform .14s var(--ease); display:flex; flex-direction:column; }
.product-card:hover{ border-color:color-mix(in srgb, var(--green) 55%, var(--border)); }
.product-card:active{ transform:scale(.993); }
.p-media{ aspect-ratio:1/1; background:var(--bg2); position:relative; overflow:hidden; }
.p-media img{ width:100%; height:100%; object-fit:cover; transition:transform .45s var(--ease); }
.product-card:hover .p-media img{ transform:scale(1.035); }
.p-media .ph{ width:100%; height:100%; display:grid; place-items:center; color:var(--border); }
.p-media .ph svg{ width:34px; height:34px; stroke:currentColor; fill:none; stroke-width:1.4; }
.p-save{
  position:absolute; top:8px; right:8px; width:31px; height:31px; border-radius:9px;
  background:color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter:blur(8px);
  display:grid; place-items:center; color:#fff; transition:.18s var(--ease);
}
.p-save svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linejoin:round; }
.p-save.on,
[data-action="toggle-save"].on {
  color: #ef4444 !important;
}
.p-save.on svg,
[data-action="toggle-save"].on svg,
.btn[data-action="toggle-save"].on svg {
  fill: #ef4444 !important;
  stroke: #ef4444 !important;
  animation: heartPop .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes heartPop {
  0% { transform: scale(0.8); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
.p-cart-btn {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: var(--surface-soft);
  border: 1px solid var(--border);
  color: var(--text);
  display: grid;
  place-items: center;
  transition: all .18s var(--ease);
  cursor: pointer;
  flex: 0 0 auto;
}
.p-cart-btn:hover {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}
.p-cart-btn:active {
  transform: scale(0.9);
}
.p-cart-btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  stroke-width: 1.9;
}
.tab .tab-badge[data-saved-badge]{
  background: #ef4444;
}
@keyframes badgeBump {

  if (full.length >= PHONE_MIN_DIGITS && full.length <= PHONE_MAX_DIGITS) return (raw.startsWith('+') ? '+' : '') + full;
  return raw;                                        // leave as typed; validation will reject
}
/* match key for login: digits, last-10 tolerant (matches existing last-10 matching) */
function phoneMatchKey(s) { const d = phoneDigits(s); return d.length > 10 ? d.slice(-10) : d; }

const timeAgo = (iso) => {
  if (!iso) return '';
  const d = (Date.now() - new Date(iso).getTime()) / 1000;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  if (d < 604800) return Math.floor(d / 86400) + 'd ago';
  return new Date(iso).toLocaleDateString('en-NG', { day: 'numeric', month: 'short' });
};

const debounce = (fn, ms = 320) => {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
};

function authEmailError(error) {
  const message = String(error?.message || error || '').toLowerCase();
  if (message.includes('rate limit') || message.includes('too many') || message.includes('email_rate_limit') || message.includes('over_email_send_rate_limit')) {
    return 'Too many email requests. Please wait a few minutes, check your inbox or spam folder, and try again.';
  }
  if (message.includes('invalid') && message.includes('email')) {
    return 'The email address is invalid or not accepted. Please use a valid email (e.g. yourname@gmail.com).';
  }
  if (message.includes('invalid login credentials')) {
    return 'The email could not be verified. Request a new sign-in email.';
  }
  if (message.includes('email not confirmed')) {
    return 'Open the confirmation email link before signing in again.';
  }
  return error?.message || 'Unable to send the email. Please try again.';
}

function canSendAuthEmail(email) {
  const key = `jalsa.email.sent.${String(email).trim().toLowerCase()}`;
  const previous = Number(sessionStorage.getItem(key) || '0');
  const waitSeconds = 60 - Math.floor((Date.now() - previous) / 1000);
  if (previous && waitSeconds > 0) {
    throw new Error(`A sign-in email was just sent. Check your inbox or spam folder and wait ${waitSeconds} seconds before requesting another.`);
  }
  sessionStorage.setItem(key, String(Date.now()));
}

}

    }

function refreshThemeToggles() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const label = `Switch to ${isLight ? 'dark' : 'light'} mode`;
  document.querySelectorAll('[data-action="toggle-theme"]').forEach(btn => {
    btn.innerHTML = icon(isLight ? 'sun' : 'moon');
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);

function applyPrefs() {
  const root = document.documentElement;
  const t = state.prefs.theme;
  const resolved = t === 'system'
    ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : t;
  root.setAttribute('data-theme', resolved);
  root.setAttribute('data-textsize', state.prefs.textsize);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', resolved === 'light' ? '#FFFFFF' : '#101310');
  refreshThemeToggles();
}

      .select('id,name,slug,sort_order').eq('is_active', true).order('sort_order');

      .eq('is_active', true).order('starts_on', { ascending: true }).limit(1).maybeSingle();
    return data || null;
  },
  async announcements(limit = 3) {
    if (!supabase) return [];
    const { data } = await supabase.from('announcements').select('*')
      .not('published_at', 'is', null).is('archived_at', null)
      .order('published_at', { ascending: false }).limit(limit);
    return data || [];
  },

  /* ---- products ---- */
  async products({ page = 0, size = CONFIG.PAGE_SIZE, category = null, search = '', sort = 'recent' } = {}) {
    if (!supabase) return [];
    let q = supabase.from('products')
      .select('id,name,slug,price,currency,is_available,is_preorder,created_at,vendor_id,'
        + 'vendors!inner(id,business_name,slug,status,stall_number),'
        + 'product_images(storage_path,sort_order)')
      .eq('vendors.status', 'approved')
      .range(page * size, page * size + size - 1);

    if (category) q = q.eq('category_id', category);
    if (search) q = q.ilike('name', `%${search}%`);
    q = sort === 'price_asc' ? q.order('price', { ascending: true })
      : sort === 'price_desc' ? q.order('price', { ascending: false })
      : q.order('created_at', { ascending: false });

    const { data, error } = await q;
    if (error) { console.warn(error); return []; }
    return (data || []).map(normalizeProduct);
  },

  async product(id) {
    if (!supabase) return null;
    const { data, error } = await supabase.from('products')
      .select('*, vendors!inner(id,business_name,slug,status,stall_number,whatsapp_number,'
        + 'accepts_preorders,preorder_details,collection_info,jalsa_availability),'
        + 'product_images(id,storage_path,sort_order),categories(name,slug)')
      .eq('id', id).maybeSingle();
    if (error || !data) return null;
    return normalizeProduct(data);
  },

  async vendors({ page = 0, size = CONFIG.PAGE_SIZE, categoryId = null, search = '', sort = 'featured', featured = null } = {}) {
    if (!supabase) return { items: [], count: 0 };
    let q = supabase.from('vendors')
      .select('id,business_name,slug,logo_path,cover_path,business_category,category_id,stall_number,'
        + 'participation_type,jalsa_availability,is_featured,categories(name,slug)', { count: 'exact' })
      .eq('status', 'approved');

    if (categoryId) q = q.eq('category_id', categoryId);
    if (featured === true) q = q.eq('is_featured', true);
    if (search) {
      const term = search.replace(/[%,()*]/g, ' ').trim();
      if (term) q = q.or(`business_name.ilike.%${term}%,business_category.ilike.%${term}%`);
    }

    if (sort === 'name') q = q.order('business_name', { ascending: true });
    else if (sort === 'recent') q = q.order('created_at', { ascending: false });
    else q = q.order('is_featured', { ascending: false }).order('created_at', { ascending: false });

    q = q.range(page * size, page * size + size - 1);
    const { data, error, count } = await q;
    if (error) { console.warn(error); return { items: [], count: 0 }; }
    return { items: data || [], count: count || 0 };
  },

  async vendorCounts() {
    if (!supabase) return {};
    const { data, error } = await supabase.rpc('jalsa_vendor_counts');
    if (!error && Array.isArray(data)) {
      const map = {};
      data.forEach(r => { map[r.category_id] = Number(r.vendor_count) || 0; });
      return map;
    }
    // Fallback when the RPC has not been installed yet.
    const { data: rows } = await supabase.from('vendors')
      .select('category_id').eq('status', 'approved').not('category_id', 'is', null).limit(1000);
    const map = {};
    (rows || []).forEach(r => { map[r.category_id] = (map[r.category_id] || 0) + 1; });
    return map;
  },

  /* New arrivals that show at most `perVendor` products per vendor so a
     single storefront cannot flood a discovery grid. */
  async discoverProducts({ perVendor = 1, size = 12, categoryId = null, search = '' } = {}) {
    if (!supabase) return [];
    const select = 'id,name,slug,price,currency,is_available,is_preorder,created_at,vendor_id,'
      + 'vendors!inner(id,business_name,slug,status,stall_number),'
      + 'product_images(storage_path,sort_order)';

    // Preferred: server-side per-vendor cap (requires the SQL upgrade).
    const { data: ranked, error: rpcError } = await supabase.rpc('jalsa_discover_products', {
      p_per_vendor: perVendor,
      p_limit: size,
      p_category_id: categoryId,
      p_search: search || null
    });
    if (!rpcError && Array.isArray(ranked) && ranked.length) {
      const order = ranked.map(r => r.product_id);
      const { data } = await supabase.from('products').select(select).in('id', order);
      const byId = new Map((data || []).map(row => [row.id, normalizeProduct(row)]));
      return order.map(id => byId.get(id)).filter(Boolean);
    }
    if (!rpcError) return [];

    // Fallback for deployments where the RPC has not been installed yet.
    let q = supabase.from('products')
      .select(select)
      .eq('vendors.status', 'approved')
      .eq('is_available', true)
      .order('created_at', { ascending: false })
      .limit(Math.max(150, size * 12));
    if (categoryId) q = q.eq('category_id', categoryId);
    if (search) q = q.ilike('name', `%${search}%`);

    const { data, error } = await q;
    if (error) { console.warn(error); return []; }
    const seen = new Map();
    const out = [];
    for (const row of (data || [])) {
      const used = seen.get(row.vendor_id) || 0;
      if (used >= perVendor) continue;
      seen.set(row.vendor_id, used + 1);
      out.push(normalizeProduct(row));
      if (out.length >= size) break;
    }
    return out;
  },

  async vendorBySlug(slug) {
    if (!supabase) return null;
    const { data } = await supabase.from('vendors').select('*')
      .eq('slug', slug).eq('status', 'approved').maybeSingle();
    return data || null;
  },

  async vendorProducts(vendorId, { includeUnavailable = false } = {}) {
    if (!supabase) return [];
    let q = supabase.from('products')
      .select('id,name,slug,price,currency,is_available,is_preorder,created_at,vendor_id,product_images(storage_path,sort_order)')
      .eq('vendor_id', vendorId);
    if (!includeUnavailable) q = q.eq('is_available', true);
    const { data } = await q.order('created_at', { ascending: false }).limit(60);
    return (data || []).map(normalizeProduct);

        const { data } = await supabase.from('saved_products')
          .select('product_id, products(id,name,price,is_available,vendor_id,product_images(storage_path,sort_order),vendors(business_name,slug))')
          .order('created_at', { ascending: false });
        const products = (data || []).map(r => r.products).filter(Boolean).map(normalizeProduct);
        state.saved = new Set([...products.map(p => p.id), ...LOCAL.saved]);
        updateSavedBadge();
        return products;
      } catch (err) {
        console.warn('Error fetching saved products from Supabase:', err);

    }

    // Guest / local fallback
    const localIds = LOCAL.saved;
    state.saved = new Set(localIds);
    updateSavedBadge();
    if (!localIds.length) return [];
    if (supabase) {
      try {
        const { data } = await supabase.from('products')
          .select('id,name,slug,price,currency,is_available,is_preorder,created_at,vendor_id,vendors(id,business_name,slug,status),product_images(storage_path,sort_order)')
          .in('id', localIds);
        return (data || []).map(normalizeProduct);
      } catch (_) {}
    }

  async savedToggle(productId) {
    const list = LOCAL.saved;
    const idx = list.indexOf(productId);
    const willBeSaved = idx < 0;
    if (willBeSaved) list.push(productId);
    else list.splice(idx, 1);
    LOCAL.saved = list;

    if (willBeSaved) state.saved.add(productId);
    else state.saved.delete(productId);

    if (supabase && state.session) {
      try {
        if (!willBeSaved) {
          await supabase.from('saved_products').delete().eq('product_id', productId).eq('customer_id', state.session.user.id);
        } else {
          await supabase.from('saved_products').upsert({
            product_id: productId,
            customer_id: state.session.user.id
          }, { onConflict: 'customer_id,product_id' });
        }
      } catch (err) {
        console.warn('Supabase saved_products sync error:', err);
      }
    }
    updateSavedBadge();
    return willBeSaved;
  },

  /* ---- cart ---- */
  async loadCart() {
    if (!supabase || !state.session) {
      state.cart = LOCAL.guestCart;
      updateCartBadge();
      return;
    }
    try {
      let { data: cart } = await supabase.from('carts').select('id').eq('customer_id', state.session.user.id).maybeSingle();
      if (!cart) {
        state.cart = [];
        updateCartBadge();
        return;
      }
      const { data } = await supabase.from('cart_items')
        .select('id,quantity,price_snapshot,product_id,'
          + 'products(id,name,price,is_available,vendor_id,product_images(storage_path,sort_order),'
          + 'vendors(id,business_name,slug,whatsapp_number,stall_number,preorder_details))')
        .eq('cart_id', cart.id);

      state.cart = (data || []).filter(r => r.products).map(r => {
        const normProduct = normalizeProduct(r.products);
        // Always reflect live price from products table
        const livePrice = Number(r.products?.price ?? r.price_snapshot ?? 0);
        return {
          id: r.id,
          product_id: r.product_id,
          quantity: r.quantity,
          price_snapshot: livePrice,
          product: { ...normProduct, price: livePrice },
          vendor: r.products.vendors
        };
      });
    } catch (err) {
      console.warn('Cart load error:', err);
      state.cart = [];
    }
    updateCartBadge();
  },

  async addToCart(product, vendor, qty = 1) {
    if (!state.profile) throw new Error('Please sign in to add items to your cart.');
    const v = vendor || product.vendors || {};
    const livePrice = Number(product.price ?? 0);

    if (!supabase || !state.session) {
      const cart = LOCAL.guestCart;
      const found = cart.find(i => i.product_id === product.id);
      if (found) {
        found.quantity += qty;
        found.price_snapshot = livePrice;
        if (found.product) found.product.price = livePrice;
      } else {
        cart.push({
          id: 'cart_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          product_id: product.id,
          quantity: qty,
          price_snapshot: livePrice,
          product: { ...product, price: livePrice },
          vendor: v
        });
      }
      LOCAL.guestCart = cart;
      state.cart = cart;
      updateCartBadge();
      return;
    }

    try {
      let { data: cart } = await supabase.from('carts').select('id').eq('customer_id', state.session.user.id).maybeSingle();
      if (!cart) {
        const ins = await supabase.from('carts').insert({ customer_id: state.session.user.id }).select('id').single();
        cart = ins.data;
      }
      const { data: existing } = await supabase.from('cart_items')
        .select('id,quantity').eq('cart_id', cart.id).eq('product_id', product.id).maybeSingle();
      if (existing) {
        await supabase.from('cart_items').update({
          quantity: existing.quantity + qty,
          price_snapshot: livePrice
        }).eq('id', existing.id);
      } else {
        await supabase.from('cart_items').insert({
          cart_id: cart.id,
          product_id: product.id,
          quantity: qty,
          price_snapshot: livePrice
        });
      }
      await api.loadCart();
    } catch (err) {
      console.warn('Cart add error, falling back locally:', err);
      const cart = LOCAL.guestCart;
      const found = cart.find(i => i.product_id === product.id);
      if (found) {
        found.quantity += qty;
        found.price_snapshot = livePrice;
      } else {
        cart.push({
          id: 'cart_' + Date.now(),
          product_id: product.id,
          quantity: qty,
          price_snapshot: livePrice,
          product: { ...product, price: livePrice },
          vendor: v
        });
      }
      LOCAL.guestCart = cart;
      state.cart = cart;
      updateCartBadge();
    }
  },

  async setQty(itemId, qty) {
    if (!supabase || !state.session) {
      const cart = LOCAL.guestCart;
      const it = cart.find(i => i.id === itemId);
      if (it) {
        if (qty <= 0) cart.splice(cart.indexOf(it), 1);
        else it.quantity = qty;
      }
      LOCAL.guestCart = cart;
      state.cart = cart;
      updateCartBadge();
      return;
    }

    try {
      if (qty <= 0) {
        await supabase.from('cart_items').delete().eq('id', itemId);
      } else {
        await supabase.from('cart_items').update({ quantity: qty }).eq('id', itemId);
      }
      await api.loadCart();
    } catch (err) {
      console.warn('Cart qty error, fallback local:', err);
      const cart = LOCAL.guestCart;
      const it = cart.find(i => i.id === itemId);
      if (it) {
        if (qty <= 0) cart.splice(cart.indexOf(it), 1);
        else it.quantity = qty;
      }
      LOCAL.guestCart = cart;
      state.cart = cart;
      updateCartBadge();
    }
  },

  /* ---- analytics ---- */
  async trackView(kind, id) {
    if (!supabase) return;
    try {
      if (kind === 'storefront') await supabase.from('storefront_views').insert({ vendor_id: id });
      if (kind === 'product') await supabase.from('product_views').insert({ product_id: id });
    } catch (_) {}
  },
  async trackWhatsApp(payload) {
    if (!supabase) return;
    try { await supabase.from('whatsapp_clicks').insert(payload); } catch (_) {}
  },
  async logOrderIntent(intent) {
    if (!supabase) return;
    try {
      const { error } = await supabase.from('order_intents').insert(intent);
      if (error) throw error;
    } catch (_) {
      const queue = readOrderQueue();
      queue.push(intent);
      writeOrderQueue(queue);
    }
  }
};

function normalizeProduct(p) {
  const imgs = (p.product_images || []).slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  return {
    ...p,
    images: imgs.map(i => storageUrl(i.storage_path)),
    image: imgs.length ? storageUrl(imgs[0].storage_path) : null,
    vendor_name: p.vendors?.business_name || '',
    vendor_slug: p.vendors?.slug || '',
    vendor_id: p.vendor_id || p.vendors?.id
  };
}

function storageUrl(path) {
  if (!path) return null;
  if (/^https?:|^data:/.test(path)) return path;
  if (!supabase) return null;
  const bucket = path.split('/')[0];
  const rest = path.split('/').slice(1).join('/');
  const { data } = supabase.storage.from(bucket).getPublicUrl(rest);
  return data?.publicUrl || null;
}

/* ------------------------------------------------------------
   5. AUTH
   ------------------------------------------------------------ */
/* Soft logout: anonymous accounts have no credentials, so a real signOut()
   would make the account impossible to sign back into. Instead we keep the
   Supabase session on this device and only gate it behind this flag. Login
   re-attaches the session after matching the saved name + phone. */
const SIGNED_OUT_KEY = 'jalsa.signed_out';
function isSignedOut() { try { return localStorage.getItem(SIGNED_OUT_KEY) === '1'; } catch { return false; } }
function setSignedOut(v) { try { v ? localStorage.setItem(SIGNED_OUT_KEY, '1') : localStorage.removeItem(SIGNED_OUT_KEY); } catch (_) {} }

/* Cart is only for signed-in customers. A visitor (no profile) must sign up or
   log in first so orders always carry a real name and phone number. */
function requireCustomerAuth(message = 'Please sign in to add items to your cart.') {
  if (state.profile) return true;
  toast(message, 'err');
  renderAuth('login');
  return false;
}

async function restoreSession() {
  if (!supabase) {
    state.profile = LOCAL.profile;
    if (state.profile) await afterAuth();
    return Boolean(state.profile);
  }
  if (isSignedOut()) { state.session = null; return false; }
  const { data } = await supabase.auth.getSession();
  state.session = data?.session || null;
  if (!state.session) return false;

  const { data: prof } = await supabase.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
  if (!prof) return false;
  if (prof.account_status && prof.account_status !== 'active') return false;   // blocked accounts
  state.profile = prof;

  const { data: adminRow } = await supabase.from('admin_users').select('user_id').eq('user_id', state.session.user.id).maybeSingle();
  state.isAdmin = Boolean(adminRow);

  const { data: v } = await supabase.from('vendors').select('*').eq('owner_id', state.session.user.id).maybeSingle();
  state.vendor = v || null;

  await afterAuth();
  return true;
}

async function afterAuth() {
  if (supabase && state.session) {
    try {
      const guestItems = LOCAL.guestCart;
      // Immediately wipe guest cart so items are never migrated more than once
      LOCAL.guestCart = [];
      try { localStorage.removeItem('jalsa.demo.cart'); } catch (_) {}

      if (guestItems && guestItems.length) {
        for (const item of guestItems) {
          if (item.product) {
            await api.addToCart(item.product, item.vendor, item.quantity);
          }
        }
      }
      const localSaved = LOCAL.saved;
      if (localSaved && localSaved.length) {
        for (const pid of localSaved) {
          await supabase.from('saved_products').upsert({
            product_id: pid,
            customer_id: state.session.user.id
          }, { onConflict: 'customer_id,product_id' });
        }
      }
    } catch (syncErr) {
      console.warn('Sync after auth warning:', syncErr);
    }
  }
  await Promise.all([refreshCart(), refreshSaved()]);
  if (state.vendor) state.mode = 'vendor';
}

/* (removed dead completePendingSignup: nothing ever writes 'jalsa.pending.signup';
   anonymous signup + name+phone login replaced the email-OTP flow.) */

async function refreshCart() { await api.loadCart(); updateCartBadge(); }
async function refreshSaved() {
  const list = await api.savedList();
  state.saved = new Set(list.map(p => p.id));
  updateSavedBadge();
}

async function customerSignup({ fullName, phone, consent }) {
  setSignedOut(false);
  // anti-junk: real name (not punctuation-only like ".....") + a real phone number
  const cleanName = normalizeName(fullName);
  if (!nameIsValid(cleanName)) throw new Error('Please enter your real full name (not just symbols).');
  const cleanPhone = normalizePhone(phone);
  if (!phoneIsValid(cleanPhone)) throw new Error('Please enter a valid phone number.');
  if (!supabase) {
    state.profile = {
      id: 'demo-user', full_name: cleanName, phone: cleanPhone,
      marketing_consent: consent, created_at: new Date().toISOString()
    };
    LOCAL.profile = state.profile;
    await afterAuth();
    return;
  }
  // Sign in anonymously — no email or verification needed at all.
  const { data: anonData, error: anonError } = await supabase.auth.signInAnonymously();
  if (anonError) throw new Error('Could not create account: ' + anonError.message);
  const uid = anonData?.user?.id;
  if (!uid) throw new Error('Could not create account. Please try again.');
  // Save profile to DB (name + phone are the login credentials, so fail loudly).
  const { error: profError } = await supabase.from('profiles').upsert({
    id: uid, full_name: cleanName, phone: cleanPhone,
    marketing_consent: consent, is_vendor: false
  });
  if (profError) throw new Error('Could not save your profile: ' + profError.message);
  await restoreSession();
  if (!state.profile) {
    throw new Error('Account created but the profile could not be loaded. Check the profiles RLS policies in Supabase.');
  }
  return { checkEmail: false, role: 'user' };
}

async function vendorSignup(form) {
  setSignedOut(false);
  // anti-junk: real owner name + business name + a real phone number
  const ownerName = normalizeName(form.owner_name);
  if (!nameIsValid(ownerName)) throw new Error("Please enter the owner's real full name (not just symbols).");
  const businessName = normalizeName(form.business_name);
  if (!nameIsValid(businessName)) throw new Error('Please enter a real business name (not just symbols).');
  const cleanPhone = normalizePhone(form.phone);
  if (!phoneIsValid(cleanPhone)) throw new Error('Please enter a valid WhatsApp number.');
  if (!supabase) {
    const slug = `${slugify(businessName) || 'store'}-${Math.random().toString(36).slice(2, 6)}`;
    state.profile = {
      id: 'demo-vendor',
      full_name: ownerName,
      phone: cleanPhone,
      is_vendor: true
    };
    state.vendor = {
      id: 'demo-vendor-store',
      owner_id: 'demo-vendor',
      business_name: businessName,
      slug,
      business_category: form.business_category,
      whatsapp_number: cleanPhone,
      status: 'pending'
    };
    LOCAL.profile = state.profile;
    state.mode = 'vendor';
    await afterAuth();
    return state.vendor;
  }
  // Sign in anonymously — no email or verification needed at all.
  const { data: anonData, error: anonError } = await supabase.auth.signInAnonymously();
  if (anonError) throw new Error('Could not create vendor account: ' + anonError.message);
  const uid = anonData?.user?.id;
  if (!uid) throw new Error('Could not create account. Please try again.');
  // Save profile to DB (name + phone are the login credentials, so fail loudly).
  const { error: profError } = await supabase.from('profiles').upsert({
    id: uid, full_name: ownerName, phone: cleanPhone, is_vendor: true
  });
  if (profError) throw new Error('Could not save your profile: ' + profError.message);
  // Save vendor store to DB.
  const baseSlug = slugify(businessName) || 'store';
  const slug = baseSlug + '-' + Math.random().toString(36).slice(2, 6);
  const { error: vendorError } = await supabase.from('vendors').insert({
    owner_id: uid,
    business_name: businessName,
    slug,
    business_category: form.business_category,
    category_id: categoryIdByName(form.business_category),
    state: form.state,
    district: form.district,
    local_jamaat: form.local_jamaat,
    participation_type: form.participation_type,
    stall_number: form.stall_number || null,
    description: form.description,
    whatsapp_number: cleanPhone,
    status: 'pending'                       // admin approves; owner cannot self-approve (RLS)
  });
  if (vendorError) throw new Error('Could not save your storefront: ' + vendorError.message);
  await restoreSession();
  if (!state.profile) {
    throw new Error('Account created but the profile could not be loaded. Check the profiles RLS policies in Supabase.');
  }
  return { checkEmail: false, role: 'vendor' };
}

async function loginByNameAndPhone(role, name, phone) {
  const cleanName  = normalizeName(name);
  const cleanPhone = phoneDigits(phone);
  if (!cleanName || !cleanPhone) throw new Error('Enter both your name and phone number.');

  if (!supabase) {
    if (role === 'vendor') {
      state.profile = { id: 'demo-vendor', full_name: cleanName, phone, is_vendor: true };
      state.vendor  = { id: 'demo-vendor-store', owner_id: 'demo-vendor', business_name: cleanName,
                        slug: 'demo-store', status: 'approved', whatsapp_number: phone };
      LOCAL.profile = state.profile;
      state.mode = 'vendor';
    } else {
      const existing = LOCAL.profile;
      state.profile = existing
        ? { ...existing, full_name: cleanName, phone }
        : { id: 'demo-user', full_name: cleanName, phone, created_at: new Date().toISOString() };
      LOCAL.profile = state.profile;
      state.mode = 'customer';
    }
    await afterAuth();
    return;
  }

  // Anonymous sessions can't re-authenticate after a real signOut, so "login"
  // re-attaches this device's existing session after matching name + phone.
  const { data: sessData, error: sessError } = await supabase.auth.getSession();
  if (sessError) throw new Error(sessError.message);
  const session = sessData?.session || null;
  if (!session?.user) {
    throw new Error('No account found on this device. Please sign up first.');
  }

  const { data: prof, error: lookupError } = await supabase
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .maybeSingle();
  if (lookupError) throw new Error(lookupError.message);
  if (!prof) {
    console.warn('[Jalsa] Login: session', session.user.id, 'has no profiles row');
    throw new Error('Your saved session has no profile. Please sign up again.');
  }

  const storedPhone = phoneDigits(prof.phone);
  if (!storedPhone) {
    throw new Error('This account has no phone number saved. Please sign up again so we can store it.');
  }
  const phoneOk = storedPhone === cleanPhone || phoneMatchKey(storedPhone) === phoneMatchKey(cleanPhone);
  if (!phoneOk) {
    throw new Error('That phone number does not match the account saved on this device.');
  }
  // blocked accounts cannot re-attach
  if (prof.account_status && prof.account_status !== 'active') {
    throw new Error('This account is not active. Please contact support.');
  }

  const { data: v } = await supabase.from('vendors').select('*').eq('owner_id', prof.id).maybeSingle();
  const vendorRow = v || null;

  const sameFirstWord = (a, b) => {
    const x = String(a || '').trim().split(/\s+/)[0].toLowerCase();
    const y = String(b || '').trim().split(/\s+/)[0].toLowerCase();
    return !!x && !!y && x === y;          // both must be present and match (no empty-match)
  };
  const nameOk = role === 'vendor'
    ? sameFirstWord(vendorRow?.business_name, cleanName) || sameFirstWord(prof.full_name, cleanName)
    : sameFirstWord(prof.full_name, cleanName);
  if (!nameOk) {
    throw new Error(role === 'vendor'
      ? 'Business name does not match the account saved on this device.'
      : 'Name does not match the account saved on this device.');
  }
  if (role === 'vendor' && !prof.is_vendor) {
    throw new Error('This account is not registered as a vendor.');
  }

  setSignedOut(false);
  state.session = session;
  state.profile = prof;
  LOCAL.profile = prof;
  if (role === 'vendor' || prof.is_vendor) {
    state.vendor = vendorRow;
    state.mode = 'vendor';
  } else {
    state.mode = 'customer';
  }
  await afterAuth();
}

async function logout() {
  if (supabase) setSignedOut(true);
  else { LOCAL.profile = null; }
  state.session = null; state.profile = null; state.vendor = null;
  state.cart = []; state.saved = new Set(); state.isAdmin = false; state.mode = 'customer';
  updateCartBadge();
  updateSavedBadge();
  try { history.replaceState(null, '', '#/home'); } catch (_) { location.hash = '#/home'; }
  renderAuth('login');
}

/* ------------------------------------------------------------
   6. IMAGE OPTIMISATION
   ------------------------------------------------------------ */
const IMG_PRESETS = {
  product:  { maxW: 1000, maxH: 1000, targetKB: 220, bucket: 'product-images' },
  thumb:    { maxW: 400,  maxH: 400,  targetKB: 100, bucket: 'product-images' },
  logo:     { maxW: 256,  maxH: 256,  targetKB: 60,  bucket: 'vendor-logos'   },
  cover:    { maxW: 1200, maxH: 400,  targetKB: 180, bucket: 'store-covers'   }
};

async function compressImage(file, preset) {
  if (!file.type.startsWith('image/')) throw new Error('Please choose an image file.');
  if (file.size > 12 * 1024 * 1024) throw new Error('Image is larger than 12 MB.');

  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, preset.maxW / bitmap.width, preset.maxH / bitmap.height);
  const w = Math.max(1, Math.round(bitmap.width * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0, w, h);
  bitmap.close?.();

  const supportsWebp = canvas.toDataURL('image/webp').startsWith('data:image/webp');
  const mime = supportsWebp ? 'image/webp' : 'image/jpeg';
  const ext = supportsWebp ? 'webp' : 'jpg';

  let quality = 0.86;
  let blob = await new Promise(r => canvas.toBlob(r, mime, quality));
  while (blob && blob.size / 1024 > preset.targetKB && quality > 0.45) {
    quality -= 0.08;
    blob = await new Promise(r => canvas.toBlob(r, mime, quality));
  }
  if (!blob) throw new Error('Could not process this image.');
  return { blob, ext, width: w, height: h, sizeKB: Math.round(blob.size / 1024) };
}

async function uploadImage(file, preset, vendorId, onProgress) {
  if (!supabase) throw new Error('Supabase is not configured.');
  const { blob, ext, width, height, sizeKB } = await compressImage(file, preset);
  onProgress?.(30);
  const path = `${vendorId}/${crypto.randomUUID()}.${ext}`;
  const { error } = await supabase.storage.from(preset.bucket)
    .upload(path, blob, { contentType: blob.type, cacheControl: '31536000', upsert: false });
  if (error) throw new Error(error.message);
  onProgress?.(100);
  return { storagePath: `${preset.bucket}/${path}`, width, height, sizeKB };
}

        { id: 'vdash', label: 'Dashboard', ico: 'chart', href: '#/vendor' },
        { id: 'vproducts', label: 'Products', ico: 'box', href: '#/vendor/products' },
        { id: 'vstore', label: 'Storefront', ico: 'store', href: '#/vendor/storefront' },
        { id: 'vprofile', label: 'Profile', ico: 'settings', href: '#/vendor/profile' },
        { id: 'vme', label: 'Me', ico: 'me', href: '#/me' }
      ]
    : [
        { id: 'home', label: 'Home', ico: 'home', href: '#/home' },
        { id: 'explore', label: 'Explore', ico: 'explore', href: '#/explore' },
        { id: 'saved', label: 'Saved', ico: 'saved', href: '#/saved', badge: 'saved' },
        { id: 'cart', label: 'Cart', ico: 'cart', href: '#/cart', badge: 'cart' },
        { id: 'me', label: 'Me', ico: 'me', href: '#/me' }
      ];

  const current = state.route.name === 'category' ? 'explore' : state.route.name;
  el.innerHTML = `<div class="tabbar-wrap">` + tabs.map(t => `
    <a class="tab ${current === t.id ? 'active' : ''}" href="${t.href}">
      ${icon(t.ico)}<span>${t.label}</span>
      ${t.badge === 'cart' ? `<span class="tab-badge hide" data-cart-badge>0</span>` : ''}
      ${t.badge === 'saved' ? `<span class="tab-badge hide" data-saved-badge>0</span>` : ''}
    </a>`).join('') + `</div>`;
  updateCartBadge();
  updateSavedBadge();
}

function productCard(p) {
  const saved = state.saved.has(p.id);
  const img = p.image
    ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" decoding="async" width="400" height="400">`
    : `<div class="ph">${icon('image')}</div>`;
  return `
  <article class="product-card" data-product="${esc(p.id)}">
    <a class="p-media" href="#/product/${esc(p.id)}" aria-label="${esc(p.name)}">
      ${img}
      ${p.is_preorder ? '<span class="p-flag pre">Preorder</span>' : ''}
      ${p.is_available === false ? '<span class="p-flag out">Unavailable</span>' : ''}
    </a>
    <button class="p-save ${saved ? 'on' : ''}" data-action="toggle-save" data-id="${esc(p.id)}"
      aria-label="${saved ? 'Remove from saved' : 'Save product'}">${icon('saved')}</button>
    <div class="p-body">
      <a href="#/product/${esc(p.id)}" class="p-name">${esc(p.name)}</a>
      ${p.vendor_slug
        ? `<a class="p-vendor" href="#/store/${esc(p.vendor_slug)}">${esc(p.vendor_name || 'Visit store')}</a>`
        : `<span class="p-vendor">${esc(p.vendor_name || '')}</span>`}
      <div class="row-between" style="margin-top:auto;padding-top:6px;align-items:center">
        <span class="p-price" style="margin:0;padding:0">${money(p.price)}</span>
        ${p.is_available !== false ? `
          <button class="p-cart-btn" data-action="quick-add-cart" data-id="${esc(p.id)}" title="Add to cart" aria-label="Add to cart">
            ${icon('cart')}
          </button>` : ''}
      </div>
    </div>
  </article>`;
}

function emptyState(ico, title, body, action) {
  return `<div class="empty">
    <div class="e-ico">${icon(ico)}</div>
    <h3>${esc(title)}</h3>
    <p>${esc(body)}</p>
    ${action || ''}
  </div>`;
}

function skeletonGrid(n = 6) {
  return `<div class="product-grid">` +
    Array.from({ length: n }).map(() => `
      <div class="product-card" aria-hidden="true">
        <div class="skel" style="aspect-ratio:1/1;border-radius:0"></div>
        <div style="padding:12px">
          <div class="skel" style="height:11px;width:82%;margin-bottom:7px"></div>
          <div class="skel" style="height:9px;width:52%;margin-bottom:10px"></div>
          <div class="skel" style="height:12px;width:38%"></div>

}

/* ------------------------------------------------------------
   9. RENDER — ROUTER
   ------------------------------------------------------------ */
function parseRoute() {
  const raw = location.hash.replace(/^#/, '') || '/home';
  const path = raw.split('?')[0];
  const parts = path.split('/').filter(Boolean);
  return { name: parts[0] || 'home', params: { id: parts[1], section: parts[1] } };
}

async function router() {
  const r = parseRoute();
  state.route = r;

  // Admin route guard
  if (r.name === 'admin') {
    return renderAdmin(r.params.section);
  }
  if (r.name === 'privacy') return renderPrivacy();

  // Protected routes that strictly require authentication
  const authOnly = ['vendor', 'cart'];
  if (!state.profile && authOnly.includes(r.name)) {
    renderAuth('login');
    return;
  }

  $('#auth').classList.add('hide');
  $('#app').classList.remove('hide');
  renderHeader();
  renderTabbar();

  const view = $('#view');
  view.innerHTML = `<div class="container" style="padding:30px 0">${skeletonGrid(4)}</div>`;
  window.scrollTo({ top: 0, behavior: 'instant' });

  switch (r.name) {
    case 'home':      return renderHome();
    case 'explore':   return renderExplore();
    case 'category':  return renderCategory(r.params.id);
    case 'saved':     return renderSaved();
    case 'cart':      return renderCart();
    case 'me':        return renderMe();
    case 'settings':  return renderSettings();
    case 'product':   return renderProduct(r.params.id);
    case 'store':     return renderStore(r.params.id);
    case 'vendor':    return renderVendorArea(r.params.section);
    default:          return renderHome();
  }
}

async function renderHome() {
  const view = $('#view');
  const [featuredRes, counts, products, anns] = await Promise.all([
    api.vendors({ size: 10, sort: 'featured' }),
    api.vendorCounts(),
    api.discoverProducts({ perVendor: 1, size: 12 }),
    api.announcements(2)
  ]);
  const ev = state.activeEvent;
  const featured = featuredRes.items;
  const cats = state.categories;

  const ranked = cats
    .filter(c => (counts[c.id] || 0) > 0)
    .sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0));
  const orderedCats = [...cats].sort((a, b) => {
    const diff = (counts[b.id] || 0) - (counts[a.id] || 0);
    return diff !== 0 ? diff : (a.sort_order || 0) - (b.sort_order || 0);
  });
  const railCats = (ranked.length ? ranked : cats).slice(0, 6);
  const railResults = await Promise.all(railCats.map(async c => ({
    cat: c,
    vendors: (await api.vendors({ categoryId: c.id, size: 8, sort: 'featured' })).items
  })));
  const rails = railResults.filter(r => r.vendors.length);

  view.innerHTML = `
  <div class="container">
    <div style="padding:18px 0 4px">
      <div class="searchbar">
        ${icon('search')}
        <input type="search" id="home-search" placeholder="Search products, vendors..." autocomplete="off">
      </div>
    </div>

    ${ev ? eventBanner(ev) : ''}
    ${anns.length ? anns.map(a => `
      <div class="notice info" style="margin-top:12px">${icon('bell')}<span><b>${esc(a.title)}</b> — ${esc(a.body)}</span></div>`).join('') : ''}

    <section class="section">
      <div class="section-head"><h2 class="section-title">Shop by category</h2>
        <a class="link" href="#/explore?tab=vendors">See all</a></div>
      <div class="cat-row">
        ${(cats.length
          ? orderedCats.map(c => `<a class="cat-chip" href="#/category/${esc(c.slug)}">${esc(c.name)}${counts[c.id] ? `<span class="chip-count">${counts[c.id]}</span>` : ''}</a>`)
          : FALLBACK_CATEGORY_NAMES.slice(0, 10).map(c => `<a class="cat-chip" href="#/explore?tab=vendors">${esc(c)}</a>`)
        ).join('')}
      </div>
    </section>

    ${featured.length ? `
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Featured &amp; new vendors</h2>
        <a class="link" href="#/explore?tab=vendors">Explore all</a>
      </div>
      <div class="hscroll">
        ${featured.map(vendorCard).join('')}
      </div>
    </section>` : ''}

    ${rails.map(r => `
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">${esc(r.cat.name)}</h2>
        <a class="link" href="#/category/${esc(r.cat.slug)}">See all</a>
      </div>
      <div class="hscroll">
        ${r.vendors.map(vendorCard).join('')}
      </div>
    </section>`).join('')}

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">New from vendors</h2>
        <a class="link" href="#/explore?tab=products">See all</a>
      </div>
      <p class="sub" style="margin:-4px 0 12px">One pick per vendor — open a storefront to see everything they sell.</p>
      ${products.length
        ? `<div class="product-grid">${products.map(productCard).join('')}</div>`
        : emptyState('box', 'No products yet',
            'Approved vendors will appear here as soon as they publish their catalogue.',
            state.vendor ? '' : `<a class="btn btn-primary" href="#/vendor-signup">Become a vendor</a>`)}
    </section>

    <div class="foot-note">
      Jalsa Market · Discover. Connect. Shop at Jalsa.<br>
      <a href="#/privacy">Privacy</a> · <a href="${supportLink('Assalamu Alaikum, I need help with Jalsa Market.')}" target="_blank" rel="noopener">Support</a>
    </div>
  </div>`;

  $('#home-search')?.addEventListener('input', debounce((e) => {
    const q = e.target.value.trim();

function eventBanner(ev) {
  const start = new Date(ev.starts_on + 'T00:00:00');
  const days = Math.max(0, Math.ceil((start - Date.now()) / 86400000));
  const started = days === 0;
  return `
  <div class="event-banner" style="margin-top:14px">
    <div class="eb-body">
      <h4>${esc(ev.name || 'Jalsa')} ${started ? 'is here' : 'is coming'}</h4>
      <p>${esc(new Date(ev.starts_on).toLocaleDateString('en-NG', { day: 'numeric', month: 'long' }))}
         – ${esc(new Date(ev.ends_on).toLocaleDateString('en-NG', { day: 'numeric', month: 'long', year: 'numeric' }))}</p>
      ${!started ? `<div class="countdown">
        <div><b>${days}</b><small>days</small></div>
        <div><b>${Math.floor(days / 7)}</b><small>weeks</small></div>
      </div>` : `<div class="notice info" style="margin-top:10px">${icon('clock')}<span>Vendors are open — check stall numbers and preorder details on each storefront.</span></div>`}
    </div>
  </div>`;
}

  const view = $('#view');
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const q = params.get('q') || '';
  const cat = params.get('cat') || '';

  const allProducts = params.get('all') === '1';
  const catName = state.categories.find(c => c.id === cat)?.name || '';

  const vendorSorts = ['featured', 'recent', 'name'];
  const productSorts = ['recent', 'price_asc', 'price_desc'];
  const allowedSorts = tab === 'vendors' ? vendorSorts : productSorts;
  let sort = params.get('sort') || '';
  if (!allowedSorts.includes(sort)) sort = tab === 'vendors' ? 'featured' : 'recent';

  const link = (patch) => {
    const p = new URLSearchParams(params.toString());
    Object.entries(patch).forEach(([k, v]) => { (v === null || v === '') ? p.delete(k) : p.set(k, v); });
    return `#/explore?${p.toString()}`;
  };

  view.innerHTML = `
    <div class="container">
      <div style="padding:18px 0 12px">
        <div class="searchbar">
          ${icon('search')}
          <input type="search" id="explore-search" value="${esc(q)}" placeholder="Search products, vendors..." autocomplete="off">
        </div>
      </div>
      <div class="cat-row" style="margin-bottom:14px">
        <a class="cat-chip ${!cat ? 'active' : ''}" href="${link({ cat: null })}">All</a>
        ${state.categories.map(c => `
          <a class="cat-chip ${cat === c.id ? 'active' : ''}" href="${link({ cat: c.id })}">${esc(c.name)}</a>`).join('')}
      </div>
      <div class="row-between" style="margin-bottom:16px;flex-wrap:wrap;gap:10px">
        <div class="segmented">
          <button class="${tab === 'vendors' ? 'on' : ''}" data-action="explore-tab" data-tab="vendors">Vendors</button>
          <button class="${tab === 'products' ? 'on' : ''}" data-action="explore-tab" data-tab="products">Products</button>
        </div>
        <select class="select" id="sort-select" style="width:auto;height:38px;padding:0 38px 0 12px;font-size:.79rem">
          ${tab === 'vendors' ? `
            <option value="featured" ${sort === 'featured' ? 'selected' : ''}>Featured first</option>
            <option value="recent" ${sort === 'recent' ? 'selected' : ''}>Recently joined</option>
            <option value="name" ${sort === 'name' ? 'selected' : ''}>Name: A–Z</option>` : `
            <option value="recent" ${sort === 'recent' ? 'selected' : ''}>Recently added</option>
            <option value="price_asc" ${sort === 'price_asc' ? 'selected' : ''}>Price: low to high</option>
            <option value="price_desc" ${sort === 'price_desc' ? 'selected' : ''}>Price: high to low</option>`}
        </select>
      </div>
      <div id="explore-results">${skeletonGrid(tab === 'vendors' ? 4 : 6)}</div>
    </div>`;

  if (pendingExploreFocus) {
    const input = $('#explore-search');
    if (input) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
    pendingExploreFocus = false;
  }

  const results = $('#explore-results');
  if (tab === 'vendors') {
    const { items, count } = await api.vendors({
      page: 0, size: CONFIG.PAGE_SIZE, categoryId: cat || null, search: q, sort
    });
    results.innerHTML = count
      ? `<p class="sub" style="margin-bottom:10px">${count} vendor${count === 1 ? '' : 's'}${catName ? ' in ' + esc(catName) : ''}${q ? ` matching “${esc(q)}”` : ''}</p>
         <div class="stack" id="explore-vendors">${items.map(vendorListItem).join('')}</div>
         ${count > items.length
           ? `<button class="btn btn-ghost btn-block" style="margin-top:14px" data-action="explore-more"
                data-kind="vendors" data-page="1" data-cat="${esc(cat)}" data-q="${esc(q)}" data-sort="${esc(sort)}">Load more vendors</button>`
           : ''}`
      : emptyState('store', 'No vendors found', 'Try a different search term or category.',
          `<a class="btn btn-ghost" href="${link({ tab: 'products' })}">Search products instead</a>`);
  } else if (allProducts) {
    const products = await api.products({ page: 0, size: CONFIG.PAGE_SIZE, category: cat || null, search: q, sort });
    results.innerHTML = products.length
      ? `<p class="sub" style="margin-bottom:10px">All products${catName ? ' in ' + esc(catName) : ''} ·
           <a class="link" href="${link({ all: null })}">Back to vendor picks</a></p>
         <div class="product-grid" id="explore-products">${products.map(productCard).join('')}</div>
         ${products.length >= CONFIG.PAGE_SIZE
           ? `<button class="btn btn-ghost btn-block" style="margin-top:14px" data-action="explore-more"
                data-kind="products" data-page="1" data-cat="${esc(cat)}" data-q="${esc(q)}" data-sort="${esc(sort)}">Load more products</button>`
           : ''}`
      : emptyState('search', 'Nothing matched', 'Try different keywords or another category.',
          `<a class="btn btn-ghost" href="${link({ tab: 'vendors' })}">Search vendors instead</a>`);
  } else {
    const products = await api.discoverProducts({ perVendor: 1, size: 24, categoryId: cat || null, search: q });
    results.innerHTML = products.length
      ? `<p class="sub" style="margin-bottom:10px">One pick per vendor${catName ? ' in ' + esc(catName) : ''} ·
           <a class="link" href="${link({ all: '1' })}">Show all products</a></p>
         <div class="product-grid">${products.map(productCard).join('')}</div>`
      : emptyState('search', 'Nothing matched', 'Try different keywords or another category.',
          `<a class="btn btn-ghost" href="${link({ tab: 'vendors' })}">Search vendors instead</a>`);
  }

  $('#explore-search')?.addEventListener('input', debounce((e) => {
    const val = e.target.value.trim();
    const p = new URLSearchParams(location.hash.split('?')[1] || '');
    val ? p.set('q', val) : p.delete('q');
    const next = `#/explore?${p.toString()}`;
    if (next !== location.hash) {
      pendingExploreFocus = true;
      location.hash = next;
    }
  }, 450));

  $('#sort-select')?.addEventListener('change', (e) => {
    const p = new URLSearchParams(location.hash.split('?')[1] || '');
    p.set('sort', e.target.value);
    location.hash = `#/explore?${p.toString()}`;
  });
}

          '<a class="btn btn-primary" href="#/explore?tab=vendors">Explore vendors</a>');

  if (products.length) {

    const grid = $('#category-products');
    if (section && grid) {
      section.style.display = '';
      grid.innerHTML = products.map(productCard).join('');
    }

/* ------------------------------------------------------------
   15. RENDER — CART
   ------------------------------------------------------------ */
async function renderCart() {
  const view = $('#view');
  await refreshCart();

  // Refresh live product prices & availability directly from Supabase for all items in the cart
  if (state.cart.length && supabase) {
    const pids = state.cart.map(i => i.product_id).filter(Boolean);
    if (pids.length) {
      try {
        const { data: freshProducts } = await supabase.from('products')
          .select('id,name,price,is_available,vendors(id,business_name,slug,whatsapp_number,stall_number)').in('id', pids);
        if (freshProducts?.length) {
          const freshMap = new Map(freshProducts.map(p => [p.id, p]));
          for (const item of state.cart) {
            const fresh = freshMap.get(item.product_id);
            if (fresh) {
              const livePrice = Number(fresh.price ?? 0);
              item.price_snapshot = livePrice;
              if (item.product) {
                item.product.name = fresh.name;
                item.product.price = livePrice;
                item.product.is_available = fresh.is_available;
              }
              if (fresh.vendors) item.vendor = fresh.vendors;
            }
          }
        }
      } catch (_) {}
    }
  }

  const groups = new Map();
  for (const item of state.cart) {
    const vid = item.vendor?.id || item.product?.vendor_id || 'unknown';
    if (!groups.has(vid)) groups.set(vid, { vendor: item.vendor, items: [] });
    groups.get(vid).items.push(item);
  }

  const total = state.cart.reduce((s, i) => {
    const unitPrice = Number(i.product?.price ?? i.price_snapshot ?? 0);
    return s + unitPrice * (i.quantity || 1);
  }, 0);

  view.innerHTML = `
  <div class="container">
    <div class="row-between" style="padding:22px 0 16px;align-items:flex-start">
      <div>
        <h1 class="display" style="font-size:1.7rem">Your cart</h1>
        <p class="sub">${state.cart.length ? state.cart.reduce((s, i) => s + (i.quantity || 1), 0) + ' item(s) from ' + groups.size + ' vendor(s)' : 'Add products from any vendor'}</p>
      </div>
      ${state.cart.length ? `<button class="btn btn-sm btn-ghost" data-action="clear-cart" style="color:var(--danger);font-size:.78rem">Clear all</button>` : ''}
    </div>

    ${state.cart.length ? `
      ${[...groups.values()].map(g => `
        <div class="cart-group">
          <div class="cg-head">
            <div class="avatar" style="width:28px;height:28px;font-size:.68rem">${esc(initials(g.vendor?.business_name || 'V'))}</div>
            <h4>${esc(g.vendor?.business_name || 'Vendor')}</h4>
            ${g.vendor?.stall_number ? `<span class="sub" style="font-size:.72rem">Stall ${esc(g.vendor.stall_number)}</span>` : ''}
          </div>
          ${g.items.map(i => {
            const unitPrice = Number(i.product?.price ?? i.price_snapshot ?? 0);
            return `
            <div class="cg-item">
              <div class="cg-thumb">${i.product?.image ? `<img src="${esc(i.product.image)}" alt="" loading="lazy">` : ''}</div>
              <div class="cg-info">
                <h5>${esc(i.product?.name || 'Product')}</h5>
                <div class="pr">${money(unitPrice)}</div>
                ${i.product?.is_available === false ? '<span class="status suspended" style="font-size:.65rem;margin-top:3px">Currently unavailable</span>' : ''}
                <div class="qty">
                  <button data-action="cart-qty" data-id="${esc(i.id)}" data-qty="${i.quantity - 1}" aria-label="Decrease">${icon('minus')}</button>
                  <span>${i.quantity}</span>
                  <button data-action="cart-qty" data-id="${esc(i.id)}" data-qty="${i.quantity + 1}" aria-label="Increase">${icon('plus')}</button>
                </div>
              </div>
              <button class="icon-btn" data-action="cart-remove" data-id="${esc(i.id)}" aria-label="Remove" style="align-self:flex-start">${icon('trash')}</button>
            </div>`;
          }).join('')}
          <div class="cg-foot">
            <span class="sub-total">Vendor subtotal <b>${money(g.items.reduce((s, i) => s + Number(i.product?.price ?? i.price_snapshot ?? 0) * (i.quantity || 1), 0))}</b></span>
            <button class="btn btn-primary btn-sm" data-action="checkout-vendor" data-vendor="${esc(g.vendor?.id || '')}">
              ${icon('whatsapp')} Order on WhatsApp
            </button>
          </div>
        </div>`).join('')}

      <div class="cart-summary" style="margin-top:6px">
        <div class="row-between"><span class="sub">Items</span><span>${state.cart.reduce((s, i) => s + (i.quantity || 1), 0)}</span></div>
        <div class="row-between"><span class="sub">Vendors</span><span>${groups.size}</span></div>
        <div class="row-between total"><span>Combined value</span><span>${money(total)}</span></div>
        <p class="sub" style="font-size:.72rem;margin-top:12px;line-height:1.6">
          Each vendor is contacted separately on WhatsApp. Jalsa Market does not process payments or deliveries.
        </p>
      </div>
      <button class="btn btn-ghost btn-block" style="margin-top:12px" data-action="go-explore">Continue browsing</button>
    ` : emptyState('cart', 'Your cart is empty',
        'Browse products from any vendor and add them here. You can order from several vendors at once.',
        '<a class="btn btn-primary" href="#/explore?tab=products">Start shopping</a>')}

    <div style="height:30px"></div>
  </div>`;
}

}

          </select>
        </div>
