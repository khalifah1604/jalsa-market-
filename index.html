          </div>
        </div>
        <div class="field">
          <label class="label">Local Jamaat</label>
          <input class="input" name="local_jamaat" value="${esc(v.local_jamaat || '')}" placeholder="e.g. Jamaat name">
        </div>
        <div class="field">
          <label class="label">Business description</label>
          <textarea class="textarea" name="description" placeholder="Tell customers about your business and products...">${esc(v.description || '')}</textarea>
        </div>
        <div class="field">
          <label class="label">Preorder details</label>
          <textarea class="textarea" name="preorder_details" placeholder="e.g. Preorders close 3 days before Jalsa.">${esc(v.preorder_details || '')}</textarea>
        </div>
        <div class="field">
          <label class="label">Collection information</label>
          <textarea class="textarea" name="collection_info" placeholder="e.g. Collect from Stall B12, Friday–Sunday.">${esc(v.collection_info || '')}</textarea>
        </div>
        <div class="row" style="gap:10px;margin-top:6px">
          <button class="btn btn-primary btn-lg" style="flex:1" type="submit">Save changes</button>
          <a class="btn btn-ghost btn-lg" href="#/vendor">Cancel</a>
        </div>
      </form>
    </div>
    <div style="height:30px"></div>
  </div>`;

  $('#form-vendor-edit')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button[type=submit]');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving changes...'; }
    const fd = new FormData(form);
    const patch = Object.fromEntries(fd.entries());
    if (patch.business_name != null) patch.business_name = normalizeName(patch.business_name);
    if ('business_name' in patch && !nameIsValid(patch.business_name)) {
      toast('Please enter a real business name (not just symbols).', 'err');
      if (btn) { btn.disabled = false; btn.textContent = 'Save changes'; }
      return;
    }
    if (patch.whatsapp_number != null) patch.whatsapp_number = normalizePhone(patch.whatsapp_number);
    if ('whatsapp_number' in patch && !phoneIsValid(patch.whatsapp_number)) {
      toast('Please enter a valid WhatsApp number.', 'err');
      if (btn) { btn.disabled = false; btn.textContent = 'Save changes'; }
      return;
    }
    const resolvedCategory = categoryIdByName(patch.business_category);
    if (resolvedCategory) patch.category_id = resolvedCategory;
    try {
      if (supabase && state.vendor?.id) {
        const { error } = await supabase.from('vendors').update(patch).eq('id', state.vendor.id);
        if (error) throw error;
      }
      Object.assign(state.vendor, patch);
      if (LOCAL.profile) {
        const p = LOCAL.profile;
        p.business_name = patch.business_name;
        LOCAL.profile = p;
      }
      toast('Store details updated successfully');
      location.hash = '#/vendor';
      await router();
    } catch (err) {
      toast(err.message, 'err');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Save changes'; }
    }
  });

  $$('[data-upload]').forEach(input => {
    input.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const kind = e.target.dataset.upload;
      const preset = kind === 'logo' ? IMG_PRESETS.logo : IMG_PRESETS.cover;
      toast('Optimising image…');
      // If user is running in demo mode or without an authenticated Supabase session
      if (!supabase || !state.session?.user || String(state.vendor?.id || '').startsWith('demo')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const column = kind === 'logo' ? 'logo_path' : 'cover_path';
          state.vendor[column] = ev.target.result;
          if (LOCAL.profile) LOCAL.profile[column] = ev.target.result;
          toast('Image updated (local preview)');
          renderVendorProfile();
        };
        reader.readAsDataURL(file);
        return;
      }
      try {
        const res = await uploadImage(file, preset, state.vendor.id);
        const column = kind === 'logo' ? 'logo_path' : 'cover_path';
        const { error } = await supabase.from('vendors').update({ [column]: res.storagePath }).eq('id', state.vendor.id);
        if (error) throw error;
        state.vendor[column] = res.storagePath;
        toast(`Uploaded (${res.sizeKB} KB)`);
        renderVendorProfile();
      } catch (err) {
        console.warn('Supabase storage upload error:', err);
        const msg = String(err.message || '').toLowerCase();
        if (msg.includes('bucket not found') || msg.includes('not found') || msg.includes('row-level security')) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const column = kind === 'logo' ? 'logo_path' : 'cover_path';
            state.vendor[column] = ev.target.result;
            toast(`Bucket "${preset.bucket}" not found in Supabase. Image saved as local preview.`, 'err');
            renderVendorProfile();
          };
          reader.readAsDataURL(file);
        } else {
          toast(err.message || 'Image upload failed', 'err');
        }
      }
    });
  });
}

async function renderAdmin(section = '') {
  const app = $('#app');
  const authEl = $('#auth');

  if (!state.profile || !state.isAdmin) {
    app.classList.add('hide');
    authEl.classList.remove('hide');
    authEl.innerHTML = `
      <div class="container" style="padding-top:60px;max-width:420px">
        <div style="text-align:center;margin-bottom:26px">
          <div style="width:52px;margin:0 auto 14px">${logoSVG(52)}</div>
          <h1 class="display" style="font-size:1.6rem">Administrator</h1>
          <p class="sub" style="margin-top:6px">Restricted access</p>
        </div>
        <form id="form-admin" class="form-grid">
          <div class="field"><label class="label">Username</label>
            <input class="input" name="username" autocomplete="username" required></div>
          <div class="field"><label class="label">Password</label>
            <input class="input" name="password" type="password" autocomplete="current-password" required></div>
          <p class="field-error hide" id="a-error"></p>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
        <div class="foot-note"><a href="#/home">Return to Jalsa Market</a></div>
      </div>`;

    $('#form-admin')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const errEl = $('#a-error');
      errEl.classList.add('hide');
      try {
        if (fd.get('username') !== CONFIG.ADMIN_PATH) throw new Error('Invalid administrator credentials.');
        if (!supabase) throw new Error('Supabase is not configured.');
        const secret = String(fd.get('password') || '');
        const { data: sessData } = await supabase.auth.getSession();
        if (!sessData?.session) {
          const { data: anonData, error: anonError } = await supabase.auth.signInAnonymously();
          if (anonError) throw new Error(anonError.message);
        }
        const { data: claimed, error: claimError } = await supabase.rpc('jalsa_claim_admin', { p_secret: secret });
        if (claimError) throw new Error(claimError.message);
        if (!claimed) throw new Error('Invalid administrator credentials.');
        setSignedOut(false);
        const ok = await restoreSession();
        if (!ok || !state.isAdmin) throw new Error('This account does not have administrator access.');
        router();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hide');

/* ------------------------------------------------------------
   19. EVENT HANDLERS (delegated)
   ------------------------------------------------------------ */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  /* ---- lightweight WhatsApp contact analytics (do not block the link) ---- */
  if (action === 'wa-contact') {
    api.trackWhatsApp({
      target_type: 'storefront_contact',
      target_id: el.dataset.vendor || '',
      payload: { customer_key: state.profile?.id || deviceId() }
    });
    return;
  }

  /* ---- auth view switching ---- */
  if (action === 'auth-view') { e.preventDefault(); return renderAuth(el.dataset.view); }

  if (action === 'guest-browse') {
    e.preventDefault();
    $('#auth').classList.add('hide');
    $('#app').classList.remove('hide');
    if (location.hash !== '#/home') {
      location.hash = '#/home';
    } else {
      await router();
    }
    return;
  }

  if (action === 'login-role') {
    e.preventDefault();
    state.loginRole = el.dataset.role === 'vendor' ? 'vendor' : 'user';
    return renderAuth('login');
  }

  if (action === 'toggle-mode') {
    e.preventDefault();
    state.mode = state.mode === 'vendor' ? 'customer' : 'vendor';
    location.hash = state.mode === 'vendor' ? '#/vendor' : '#/home';
    return;
  }

  if (action === 'go-cart') {
    if (!requireCustomerAuth('Please sign in to view your cart.')) return;
    location.hash = '#/cart';
    return;
  }
  if (action === 'go-me')   { location.hash = '#/me'; return; }
  if (action === 'go-explore') { location.hash = '#/explore'; return; }
  if (action === 'edit-vendor') { location.hash = '#/vendor/profile'; return; }
  if (action === 'back') { history.length > 1 ? history.back() : (location.hash = '#/home'); return; }
  if (action === 'close-sheet') { closeSheet(); return; }

  if (action === 'logout') {
    e.preventDefault();
    openSheet(`
      <h2>Log out?</h2>
      <div class="sheet-body">You'll sign back in on this device with your name and phone number. This browser stays linked to this account, so use a different browser for a separate account.</div>
      <div class="sheet-actions">
        <button class="btn btn-danger btn-block" data-action="logout-confirm">Log out</button>
        <button class="btn btn-ghost btn-block" data-action="close-sheet">Cancel</button>
      </div>`);
    return;
  }
  if (action === 'logout-confirm') { closeSheet(); await logout(); return; }

  /* ---- saved ---- */
  if (action === 'toggle-save') {
    e.preventDefault();
    e.stopPropagation();
    const pid = el.dataset.id;
    try {
      const nowSaved = await api.savedToggle(pid);
      $$(`[data-action="toggle-save"][data-id="${pid}"]`).forEach(btn => {
        btn.classList.toggle('on', nowSaved);
        btn.setAttribute('aria-label', nowSaved ? 'Remove from saved' : 'Save product');
      });
      toast(nowSaved ? 'Added to saved products' : 'Removed from saved');
      if (state.route.name === 'saved') renderSaved();
    } catch (err) { toast(err.message, 'err'); }
    return;
  }

  /* ---- quick add to cart from product card ---- */
  if (action === 'quick-add-cart') {
    e.preventDefault();
    e.stopPropagation();
    if (!requireCustomerAuth()) return;
    const pid = el.dataset.id;
    try {
      const p = await api.product(pid);
      if (!p || p.is_available === false) throw new Error('This product is currently unavailable.');
      await api.addToCart(p, p.vendors, 1);
      updateCartBadge();
      animateCartBadge();
      toast(`Added ${p.name} to cart`);
    } catch (err) { toast(err.message, 'err'); }
    return;
  }

  /* ---- product detail ---- */
  if (action === 'thumb') {
    $('#detail-img').src = el.dataset.src;
    $$('.detail-thumbs button').forEach(b => b.classList.toggle('on', b === el));
    return;
  }
  if (action === 'qty-step') {
    const span = $('#detail-qty');
    const next = Math.max(1, Math.min(99, Number(span.textContent) + Number(el.dataset.dir)));
    span.textContent = next;
    return;
  }
  if (action === 'detail-add') {
    if (!requireCustomerAuth()) return;
    const qty = Number($('#detail-qty')?.textContent || 1);
    try {
      const p = await api.product(el.dataset.id);
      if (!p || p.is_available === false) throw new Error('This product is currently unavailable.');
      await api.addToCart(p, p.vendors, qty);
      updateCartBadge();
      animateCartBadge();
      toast(`Added ${qty} × ${p.name}`);
    } catch (err) { toast(err.message, 'err'); }
    return;
  }
  if (action === 'share-product') {
    const url = `${location.origin}${location.pathname}#/product/${el.dataset.id}`;
    return shareContent(url, el.dataset.name);
  }
  if (action === 'share-store') {
    const url = `${location.origin}${location.pathname}#/store/${el.dataset.slug}`;
    return shareContent(url, el.dataset.name);
  }
  if (action === 'copy') {
    try { await navigator.clipboard.writeText(el.dataset.text); toast('Copied'); }
    catch { toast('Could not copy', 'err'); }
    return;
  }

  /* ---- cart ---- */
  if (action === 'cart-qty') {
    try { await api.setQty(el.dataset.id, Number(el.dataset.qty)); renderCart(); updateCartBadge(); }
    catch (err) { toast(err.message, 'err'); }
    return;
  }
  if (action === 'cart-remove') {
    try { await api.setQty(el.dataset.id, 0); await renderCart(); updateCartBadge(); toast('Removed'); }
    catch (err) { toast(err.message, 'err'); }
    return;
  }
  if (action === 'clear-cart') {
    if (!confirm('Are you sure you want to remove all items from your cart?')) return;
    try {
      if (supabase && state.session) {
        let { data: cart } = await supabase.from('carts').select('id').eq('customer_id', state.session.user.id).maybeSingle();
        if (cart) await supabase.from('cart_items').delete().eq('cart_id', cart.id);
      }
      LOCAL.guestCart = [];
      state.cart = [];
      updateCartBadge();
      await renderCart();
      toast('Cart cleared');
    } catch (err) { toast(err.message, 'err'); }
    return;
  }
  if (action === 'checkout-vendor') {
    if (!requireCustomerAuth('Please sign in before placing an order.')) return;
    const vendorId = el.dataset.vendor;
    const items = state.cart.filter(i => (i.vendor?.id || i.product?.vendor_id) === vendorId);
    if (!items.length) return;
    const vendor = items[0].vendor || {};
    const productIds = items.map(i => i.product_id);

    // Re-validate live prices and availability before checkout
    let fresh = [];
    try {
      const { data } = await supabase.from('products')
        .select('id,name,price,is_available').in('id', productIds);
      fresh = data || [];
    } catch (_) {}

    const unavailable = fresh.filter(f => f.is_available === false);
    if (unavailable.length) {
      toast(`${unavailable[0].name} is no longer available.`, 'err');
      return;
    }

    const lines = items.map(i => {
      const live = fresh.find(f => f.id === i.product_id);
      const price = live?.price ?? i.price_snapshot ?? i.product?.price ?? 0;
      return { name: i.product?.name || 'Product', qty: i.quantity, price, line: price * i.quantity };
    });
    const subtotal = lines.reduce((s, l) => s + l.line, 0);

    const customerName = (state.profile?.full_name || '').trim();
    const customerPhone = (state.profile?.phone || '').trim();
    if (!customerName || !customerPhone) {
      toast('Your account is missing a name or phone number. Please log out and sign up again.', 'err');
      return;
    }
    const orderCode = 'JM-' + Date.now().toString(36).slice(-4).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase();
    const totalQty = lines.reduce((s, l) => s + l.qty, 0);

    const message =
`*Jalsa Market — Order Enquiry*
${vendor.business_name || 'Vendor'}${vendor.stall_number ? ` · Stall ${vendor.stall_number}` : ''}

*Order ref:* ${orderCode}
*Customer:* ${customerName}
*Phone:* ${customerPhone}

*Items*
${lines.map((l, i) => `${i + 1}. ${l.name} × ${l.qty} — ${money(l.line)}`).join('\n')}

*Vendor subtotal:* ${money(subtotal)}
${vendor.preorder_details ? `\n*Preorder:* ${vendor.preorder_details}` : ''}
${vendor.collection_info ? `\n*Collection:* ${vendor.collection_info}` : ''}

Please confirm this order in your Jalsa Market dashboard (ref ${orderCode}).
Sent from Jalsa Market`;

    api.logOrderIntent({
      order_code: orderCode,
      vendor_id: vendorId,
      customer_id: state.profile?.id || null,
      customer_key: state.profile?.id || deviceId(),
      customer_name: customerName,
      customer_phone: customerPhone,
      items: lines,
      item_count: totalQty,
      subtotal,
      status: 'initiated',
      source: 'whatsapp'
    });

    window.open(waLink(vendor.whatsapp_number, message), '_blank', 'noopener');
    toast('Opening WhatsApp — this is an enquiry, not a confirmed order.');
    return;
  }

  if (action === 'order-view') {
    try {
      const { data } = await supabase.from('order_intents')
        .select('order_code,customer_name,customer_phone,items,subtotal,status')
        .eq('id', el.dataset.id).maybeSingle();
      if (!data) return;
      const items = Array.isArray(data.items) ? data.items : [];
      openSheet(`
        <h2>Order ${esc(data.order_code || '')}</h2>
        <div class="sheet-body">
          <p class="sub">${esc(data.customer_name || 'Customer')} · ${esc(data.customer_phone || '')}</p>
          <div class="stack" style="margin-top:12px">
            ${items.map(it => `<div class="row" style="justify-content:space-between;gap:10px">
              <span>${esc(it.name || 'Item')} × ${Number(it.qty) || 1}</span>
              <b>${money(it.line ?? ((Number(it.price) || 0) * (Number(it.qty) || 1)))}</b>
            </div>`).join('')}
          </div>
          <div class="row" style="justify-content:space-between;margin-top:12px;border-top:1px solid var(--border);padding-top:10px">
            <b>Subtotal</b><b>${money(data.subtotal)}</b>
          </div>
        </div>
        <div class="sheet-actions"><button class="btn btn-ghost btn-block" data-action="close-sheet">Close</button></div>`);
    } catch (err) { toast(err.message, 'err'); }
    return;
  }

  if (action === 'order-confirm' || action === 'order-cancel') {
    const status = action === 'order-confirm' ? 'confirmed' : 'cancelled';
    try {
      const { error } = await supabase.from('order_intents').update({
        status,
        confirmed_at: status === 'confirmed' ? new Date().toISOString() : null
      }).eq('id', el.dataset.id);
      if (error) throw error;
      toast(status === 'confirmed' ? 'Order confirmed' : 'Order cancelled');
      await renderVendorArea();
    } catch (err) { toast(err.message, 'err'); }
    return;
  }

  if (action === 'order-revert') {
    if (!confirm('Revert this confirmed order back to pending? It will no longer count as a sale.')) return;
    try {
      const { error } = await supabase.from('order_intents').update({
        status: 'initiated',
        confirmed_at: null
      }).eq('id', el.dataset.id);
      if (error) throw error;
      toast('Order reverted to pending');
      await renderVendorArea();
    } catch (err) { toast(err.message, 'err'); }
    return;
  }

  /* ---- explore ---- */
  if (action === 'explore-tab') {
    const p = new URLSearchParams(location.hash.split('?')[1] || '');
    p.set('tab', el.dataset.tab);
    location.hash = `#/explore?${p.toString()}`;
    return;
  }

  if (action === 'explore-more') {
    const kind = el.dataset.kind;
    const page = Number(el.dataset.page || 1);
    const size = CONFIG.PAGE_SIZE;
    const cat = el.dataset.cat || null;
    const q = el.dataset.q || '';
    const sort = el.dataset.sort || (kind === 'vendors' ? 'featured' : 'recent');
    el.disabled = true;
    el.textContent = 'Loading…';
    try {
      if (kind === 'vendors') {
        const { items, count } = await api.vendors({ page, size, categoryId: cat, search: q, sort });
        $('#explore-vendors')?.insertAdjacentHTML('beforeend', items.map(vendorListItem).join(''));
        if (!items.length || (page + 1) * size >= count) el.remove();
        else { el.dataset.page = String(page + 1); el.disabled = false; el.textContent = 'Load more vendors'; }
      } else {
        const items = await api.products({ page, size, category: cat, search: q, sort });
        $('#explore-products')?.insertAdjacentHTML('beforeend', items.map(productCard).join(''));
        if (items.length < size) el.remove();
        else { el.dataset.page = String(page + 1); el.disabled = false; el.textContent = 'Load more products'; }
      }
    } catch (err) {
      el.disabled = false;
      el.textContent = kind === 'vendors' ? 'Load more vendors' : 'Load more products';
      toast(err.message, 'err');
    }
    return;
  }

  if (action === 'category-more') {
    const cat = categoryBySlug(el.dataset.slug);
    if (!cat) return;
    const page = Number(el.dataset.page || 1);
    const size = CONFIG.PAGE_SIZE;
    el.disabled = true;
    el.textContent = 'Loading…';
    try {
      const { items, count } = await api.vendors({ page, size, categoryId: cat.id, sort: 'featured' });
      $('#category-vendors')?.insertAdjacentHTML('beforeend', items.map(vendorCard).join(''));
      if (!items.length || (page + 1) * size >= count) el.remove();
      else { el.dataset.page = String(page + 1); el.disabled = false; el.textContent = 'Load more vendors'; }
    } catch (err) {
      el.disabled = false;
      el.textContent = 'Load more vendors';
      toast(err.message, 'err');
    }
    return;
  }

  /* ---- preferences ---- */
  if (action === 'toggle-theme') {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    state.prefs.theme = isLight ? 'dark' : 'light';
    savePrefs();
    renderHeader();
    if (state.route.name === 'settings') renderSettings();
    return;
  }
  if (action === 'set-theme')   { state.prefs.theme = el.dataset.theme; savePrefs(); renderSettings(); renderHeader(); return; }
  if (action === 'set-textsize'){ state.prefs.textsize = el.dataset.size; savePrefs(); renderSettings(); return; }

  /* ---- vendor ---- */
  if (action === 'new-product' || action === 'edit-product') {
    return openProductEditor(el.dataset.id);
  }

  /* ---- admin ---- */
  if (action === 'admin-approve') {
    try {
      const { error: vErr } = await supabase.from('vendors').update({ status: 'approved', verified_at: new Date().toISOString() }).eq('id', el.dataset.id);
      if (vErr) throw vErr;
      await supabase.from('vendor_verification_logs').insert({ vendor_id: el.dataset.id, action: 'approved' });
      toast('Vendor approved successfully');
      renderAdmin('vendors');
    } catch (err) {
      console.error('Admin approval failed:', err);
      toast(err.message || 'Failed to approve vendor', 'err');
    }
    return;
  }
  if (action === 'admin-suspend') {
    try {
      const { error: vErr } = await supabase.from('vendors').update({ status: 'suspended' }).eq('id', el.dataset.id);
      if (vErr) throw vErr;
      await supabase.from('vendor_verification_logs').insert({ vendor_id: el.dataset.id, action: 'suspended' });
      toast('Vendor suspended');
      renderAdmin('vendors');
    } catch (err) {
      console.error('Admin suspend failed:', err);
      toast(err.message || 'Failed to suspend vendor', 'err');
    }
    return;
  }
  if (action === 'admin-hide-product') {
    try {
      const nextAvailable = el.dataset.available !== 'true';
      const { error: pErr } = await supabase.from('products').update({ is_available: nextAvailable }).eq('id', el.dataset.id);
      if (pErr) throw pErr;
      toast('Product updated');
      renderAdmin('products');
    } catch (err) {
      console.error('Admin hide-product failed:', err);
      toast(err.message || 'Failed to update product', 'err');
    }
    return;
  }
  if (action === 'export-consented') {
    const { data } = await supabase.from('profiles')
      .select('full_name,phone,created_at').eq('marketing_consent', true);
    if (!data?.length) return toast('No consented customers yet', 'err');
    const csv = 'Name,Phone,Registered\n' +
      data.map(r => `"${(r.full_name || '').replace(/"/g, '""')}","${r.phone || ''}","${r.created_at}"`).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `jalsa-marketing-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Export downloaded');
    return;
  }
});

/* Save-sheet helper */
function shareContent(url, title) {
  if (navigator.share) {
    navigator.share({ title: title || 'Jalsa Market', url }).catch(() => {});
  } else {
    openSheet(`
      <h2>Share</h2>
      <div class="sheet-body">Send this link to a friend on WhatsApp or copy it.</div>
      <div class="sheet-actions">
        <a class="btn btn-primary btn-block" href="https://wa.me/?text=${encodeURIComponent((title || 'Jalsa Market') + ' — ' + url)}" target="_blank" rel="noopener">Share on WhatsApp</a>
        <button class="btn btn-ghost btn-block" data-action="copy" data-text="${esc(url)}">Copy link</button>
        <button class="btn btn-ghost btn-block" data-action="close-sheet">Cancel</button>
      </div>`);
  }
}

/* Product editor sheet */
async function openProductEditor(id) {
  const isEdit = Boolean(id);
  let product = null;
  if (isEdit) {
    const { data } = await supabase.from('products').select('*').eq('id', id).maybeSingle();
    product = data;
  }
  openSheet(`
    <h2>${isEdit ? 'Edit product' : 'New product'}</h2>
    <form id="form-product" class="form-grid" style="margin-top:14px">
      <div class="field"><label class="label">Product name</label>
        <input class="input" name="name" required value="${esc(product?.name || '')}"></div>
      <div class="field"><label class="label">Price (₦)</label>
        <input class="input" name="price" type="number" min="0" step="0.01" required value="${esc(product?.price || '')}"></div>
      ${state.categories.length ? `
      <div class="field"><label class="label">Category</label>
        <select class="select" name="category_id">
          <option value="">Uncategorised</option>
          ${state.categories.map(c => `<option value="${esc(c.id)}" ${(product?.category_id || state.vendor?.category_id) === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
        </select>
      </div>` : ''}
      <div class="field"><label class="label">Description</label>
        <textarea class="textarea" name="description">${esc(product?.description || '')}</textarea></div>
      <div class="field"><label class="label">Product image</label>
        <label class="upload-box" style="display:block">
          <input type="file" accept="image/*" class="sr-only" id="product-image-input">
          ${icon('camera')}<p>Tap to upload (auto-optimised)</p>
        </label>
        <div class="progress hide" id="upload-progress"><i></i></div>
      </div>
      <label class="check"><input type="checkbox" name="is_available" ${product?.is_available !== false ? 'checked' : ''}>
        <span>Available for purchase</span></label>
      <label class="check"><input type="checkbox" name="is_preorder" ${product?.is_preorder ? 'checked' : ''}>
        <span>Accepting preorders for this product</span></label>
      <div class="row" style="gap:9px">
        <button class="btn btn-primary" type="submit" style="flex:1">${isEdit ? 'Save' : 'Create'}</button>
        <button class="btn btn-ghost" type="button" data-action="close-sheet">Cancel</button>
      </div>
    </form>`);

  let uploadedPath = null;
  $('#product-image-input')?.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const bar = $('#upload-progress');
    bar.classList.remove('hide');

    if (!supabase || !state.session?.user || String(state.vendor?.id || '').startsWith('demo')) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        uploadedPath = ev.target.result;
        bar.querySelector('i').style.width = '100%';
        toast('Product image loaded (local preview)');
      };
      reader.readAsDataURL(file);
      return;
    }

    try {
      const res = await uploadImage(file, IMG_PRESETS.product, state.vendor.id, (pct) => {
        bar.querySelector('i').style.width = pct + '%';
      });
      uploadedPath = res.storagePath;
      toast(`Image ready (${res.sizeKB} KB)`);
    } catch (err) {
      console.warn('Product image upload error:', err);
      const msg = String(err.message || '').toLowerCase();
      if (msg.includes('bucket not found') || msg.includes('not found') || msg.includes('row-level security')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          uploadedPath = ev.target.result;
          bar.querySelector('i').style.width = '100%';
          toast('Bucket "product-images" not found in Supabase. Image saved as preview.', 'err');
        };
        reader.readAsDataURL(file);
      } else {
        toast(err.message || 'Image upload failed', 'err');
      }
    }
  });

  $('#form-product')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
      vendor_id: state.vendor.id,
      name: fd.get('name'),
      price: Number(fd.get('price')),
      description: fd.get('description') || null,
      category_id: fd.get('category_id') || null,
      is_available: fd.get('is_available') === 'on',
      is_preorder: fd.get('is_preorder') === 'on'
    };
    try {
      let productId = id;
      if (isEdit) {
        const { error } = await supabase.from('products').update(payload).eq('id', id);
        if (error) throw error;
      } else {
        const { data, error } = await supabase.from('products').insert(payload).select('id').single();
        if (error) throw error;
        productId = data.id;
      }
      // Image attach is best-effort: a failed image must never hide the product
      // or leave the list stale. Data-URL previews are local only, so skip them.
      if (uploadedPath && !String(uploadedPath).startsWith('data:')) {
        try {
          const { error: imgError } = await supabase.from('product_images').insert({
            product_id: productId, storage_path: uploadedPath, sort_order: 0
          });
          if (imgError) throw imgError;
        } catch (imgErr) {
          console.warn('Product image attach failed:', imgErr);
          toast('Product saved, but the image could not be attached.', 'err');
        }
      } else if (uploadedPath) {
        toast('Product saved without an image (storage not configured).', 'err');
      }
      closeSheet();
      toast(isEdit ? 'Product updated' : 'Product created');
      await renderVendorProducts();
    } catch (err) { toast(err.message, 'err'); }
  });
}

   21. BOOT
   ------------------------------------------------------------ */
const AUTH_HASH_PARAMS = ['access_token', 'refresh_token', 'provider_token', 'provider_refresh_token',
  'expires_in', 'expires_at', 'token_type', 'type', 'error', 'error_code', 'error_description', 'sb'];
/* Strip Supabase auth tokens from the URL fragment WITHOUT clobbering the app route.
   (Replaces scattered `history.replaceState(..., location.pathname + location.search)` calls.) */
function stripAuthTokensFromUrl() {
  try {
    const h = location.hash.replace(/^#/, '');
    if (!h || h.startsWith('/')) return;          // app routes like #/home are left untouched
    const params = new URLSearchParams(h);
    let changed = false;
    for (const k of AUTH_HASH_PARAMS) { if (params.has(k)) { params.delete(k); changed = true; } }
    if (!changed) return;
    const rest = params.toString();
    history.replaceState(null, '', location.pathname + location.search + (rest ? '#' + rest : ''));
  } catch (_) {}
}

async function boot() {
  loadPrefs();
  console.info('[Jalsa] build', BUILD);

  // Normalise /admin path → hash route
  if (/\/admin\/?$/.test(location.pathname) && !location.hash) {
    location.replace(location.pathname.replace(/\/admin\/?$/, '/') + '#/admin');
    return;
  }

  // Handle Supabase auth error redirected in URL hash (e.g. expired link)
  if (location.hash && (location.hash.includes('error=') || location.hash.includes('error_code='))) {
    try {
      const params = new URLSearchParams(location.hash.replace(/^#/, ''));
      const desc = params.get('error_description') || params.get('error') || 'The sign-in link is invalid or expired.';
      const cleanDesc = decodeURIComponent(desc.replace(/\+/g, ' '));
      history.replaceState(null, '', location.pathname);
      setTimeout(() => {
        toast(cleanDesc, 'err');
      }, 500);
    } catch (_) {}
  }

  // Splash
  await new Promise(r => setTimeout(r, CONFIG.SPLASH_MS));
  $('#splash').classList.add('gone');

  // Public config (categories + event) can load without a session
  if (supabase) {
    [state.categories, state.activeEvent] = await Promise.all([api.categories(), api.activeEvent()]);
  }

  let authed = false;
  try { authed = await restoreSession(); } catch (err) { console.warn('Session restore failed', err); }
  stripAuthTokensFromUrl();   // remove only Supabase auth params; preserve app routes

  if (authed) {
    $('#auth').classList.add('hide');
    $('#app').classList.remove('hide');
    await router();
  } else {
    state.cart = [];
    state.saved = new Set(LOCAL.saved);
    updateCartBadge();
    updateSavedBadge();
    const r = parseRoute();
    const guestAllowed = ['home', 'explore', 'category', 'product', 'store', 'saved', 'me', 'settings', 'privacy'];
    if (location.hash && guestAllowed.includes(r.name)) {
      $('#auth').classList.add('hide');
      $('#app').classList.remove('hide');
      await router();
    } else {
      renderAuth('login');
    }
  }

  state.booted = true;
  flushOrderQueue();

  // Service worker
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}

window.addEventListener('hashchange', () => { if (state.booted) router(); });
window.addEventListener('online', () => { toast('Back online'); flushOrderQueue(); });
window.addEventListener('offline', () => toast('You are offline — showing cached content', 'err'));

/* ------------------------------------------------------------
   22. PWA INSTALL BANNER
   ------------------------------------------------------------ */
(function pwaBanner() {
  const DISMISS_KEY = 'jalsa.pwa.dismissed';
  let deferredPrompt = null;
  const banner = document.getElementById('pwa-banner');
  const installBtn = document.getElementById('pwa-install-btn');
  const cancelBtn  = document.getElementById('pwa-cancel-btn');

  // Don't show if user already dismissed or app is already installed (standalone)
  const alreadyDismissed = localStorage.getItem(DISMISS_KEY);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;

  if (alreadyDismissed || isStandalone) return;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    // Show banner after a short delay so it doesn't pop up immediately on load
    setTimeout(() => { banner.classList.remove('hide'); }, 4000);
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    banner.classList.add('hide');
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (outcome === 'accepted') {
      localStorage.setItem(DISMISS_KEY, '1');
    }
  });

  cancelBtn.addEventListener('click', () => {
    banner.classList.add('hide');
    localStorage.setItem(DISMISS_KEY, '1');
  });

  // Also hide the banner if the app gets installed later
  window.addEventListener('appinstalled', () => {
    banner.classList.add('hide');
    localStorage.setItem(DISMISS_KEY, '1');
  });
})();

boot();
