<!DOCTYPE html>
<html lang="en" data-theme="dark" data-textsize="md">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jalsa Market — Discover. Connect. Shop at Jalsa.</title>
<meta name="description" content="Jalsa Market — the year-round marketplace for Jalsa vendors and customers. Discover vendors, browse products, preorder and connect on WhatsApp." />
<meta name="theme-color" content="#101310" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./jalsa%20logo.png" type="image/png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#101310; --bg2:#191E1A; --surface:#222823; --surface2:#2A312B;
  --green:#23864B; --green-hi:#2C9E5A; --green-soft:rgba(35,134,75,.14);
  --text:#FFFFFF; --muted:#A0A7A1; --border:#2C332D; --border-soft:#242A25;
  --danger:#C4453B; --danger-soft:rgba(196,69,59,.12);
  --warn:#C9922E; --warn-soft:rgba(201,146,46,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  --radius:16px; --radius-sm:10px; --radius-lg:22px;
  --maxw:1180px;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --header-h:60px; --tabbar-h:64px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme="light"]{
  --bg:#FFFFFF; --bg2:#F5F7F5; --surface:#FFFFFF; --surface2:#F0F3F0;
  --text:#171B18; --muted:#68716A; --border:#E6EAE6; --border-soft:#EFF2EF;
  --green-soft:rgba(35,134,75,.10);
  --shadow:0 1px 2px rgba(16,19,16,.05), 0 8px 24px rgba(16,19,16,.06);
}
html[data-textsize="lg"]{ font-size:17.5px; }
html[data-textsize="xl"]{ font-size:19px; }
html{ font-size:16px; -webkit-text-size-adjust:100%; }

/* ============================================================
   2. RESET / BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-body); font-size:.95rem; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  transition:background .25s var(--ease), color .25s var(--ease);
}
img{ max-width:100%; display:block; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; cursor:pointer; padding:0; }
a{ color:inherit; text-decoration:none; }
h1,h2,h3,h4{ margin:0; font-weight:600; letter-spacing:-.015em; }
p{ margin:0; }
::selection{ background:var(--green-soft); }
:focus-visible{ outline:2px solid var(--green); outline-offset:2px; border-radius:6px; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ============================================================
   3. TYPE
   ============================================================ */
.display{ font-family:var(--font-display); font-weight:400; letter-spacing:-.01em; line-height:1.1; }
.section-title{ font-size:1.06rem; font-weight:600; letter-spacing:-.02em; }
.sub{ color:var(--muted); font-size:.82rem; }
.tiny{ font-size:.72rem; letter-spacing:.04em; text-transform:uppercase; font-weight:600; color:var(--muted); }

/* ============================================================
   4. LAYOUT
   ============================================================ */
.container{ width:100%; max-width:var(--maxw); margin:0 auto; padding:0 18px; }
.section{ padding:22px 0 6px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
.section-head .link{ font-size:.82rem; color:var(--green); font-weight:600; white-space:nowrap; }
.stack{ display:flex; flex-direction:column; gap:14px; }
.row{ display:flex; align-items:center; gap:10px; }
.row-between{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.hide{ display:none !important; }

/* ============================================================
   5. BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:44px; padding:0 18px; border-radius:12px; font-size:.86rem; font-weight:600;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  transition:transform .12s var(--ease), background .18s var(--ease), border-color .18s var(--ease), opacity .18s;
  white-space:nowrap; user-select:none;
}
.btn:active{ transform:scale(.975); }
.btn[disabled]{ opacity:.5; pointer-events:none; }
.btn-primary{ background:var(--green); border-color:var(--green); color:#fff; }
.btn-primary:hover{ background:var(--green-hi); border-color:var(--green-hi); }
.btn-ghost{ background:transparent; border-color:var(--border); }
.btn-ghost:hover{ background:var(--surface); }
.btn-danger{ background:var(--danger-soft); border-color:transparent; color:#E0705F; }
.btn-block{ width:100%; }
.btn-sm{ height:36px; padding:0 13px; font-size:.79rem; border-radius:10px; }
.btn-lg{ height:50px; font-size:.92rem; border-radius:14px; }

.icon-btn{
  width:40px; height:40px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center;
  color:var(--text); position:relative; transition:background .18s var(--ease);
}
.icon-btn:hover{ background:var(--surface); }
.icon-btn svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

/* ============================================================
   6. SPLASH
   ============================================================ */
#splash{
  position:fixed; inset:0; z-index:9000; display:grid; place-items:center;
  background:#101310; transition:opacity .55s var(--ease), visibility .55s;
}
#splash.gone{ opacity:0; visibility:hidden; }
.splash-inner{ display:flex; flex-direction:column; align-items:center; gap:20px; }
.splash-mark{ width:88px; height:88px; animation:breathe 2.6s var(--ease) infinite; }
.splash-word{ font-family:var(--font-display); font-size:1.9rem; color:#fff; letter-spacing:.01em; }
.splash-tag{ font-size:.72rem; letter-spacing:.22em; text-transform:uppercase; color:#6E7A70; font-weight:600; }
.splash-dots{ display:flex; gap:5px; margin-top:6px; }
.splash-dots i{ width:5px; height:5px; border-radius:50%; background:#2C9E5A; opacity:.35; animation:dot 1.4s ease-in-out infinite; }
.splash-dots i:nth-child(2){ animation-delay:.18s; }
.splash-dots i:nth-child(3){ animation-delay:.36s; }
@keyframes breathe{ 0%,100%{ transform:scale(1); opacity:.92 } 50%{ transform:scale(1.055); opacity:1 } }
@keyframes dot{ 0%,100%{ opacity:.25; transform:translateY(0) } 50%{ opacity:1; transform:translateY(-3px) } }

/* ============================================================
   7. AUTH / WELCOME
   ============================================================ */
#auth{ min-height:100dvh; display:flex; flex-direction:column; }
.auth-hero{ padding:44px 0 26px; text-align:center; }
.auth-hero .mark{ width:60px; height:60px; margin:0 auto 18px; }
.auth-hero h1{ font-family:var(--font-display); font-size:2.1rem; font-weight:400; line-height:1.08; }
.auth-hero p{ color:var(--muted); font-size:.9rem; margin-top:10px; max-width:32ch; margin-inline:auto; }
.auth-body{ flex:1; padding-bottom:34px; }
.choice{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  padding:18px; border-radius:var(--radius); border:1px solid var(--border);
  background:var(--surface); transition:border-color .18s var(--ease), transform .12s var(--ease), background .18s;
}
.choice:hover{ border-color:var(--green); }
.choice:active{ transform:scale(.99); }
.choice .ico{ width:44px; height:44px; border-radius:12px; background:var(--green-soft); display:grid; place-items:center; flex:0 0 auto; }
.choice .ico svg{ width:22px; height:22px; stroke:var(--green); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.choice h3{ font-size:.98rem; }
.choice p{ color:var(--muted); font-size:.79rem; margin-top:2px; }
.choice .arrow{ margin-left:auto; color:var(--muted); }

/* ============================================================
   8. FORMS
   ============================================================ */
.field{ display:flex; flex-direction:column; gap:7px; }
.label{ font-size:.78rem; font-weight:600; color:var(--muted); letter-spacing:.01em; }
.input,.select,.textarea{
  width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text);
  border-radius:12px; padding:12px 14px; font-size:.9rem; transition:border-color .18s var(--ease), background .18s;
  -webkit-appearance:none; appearance:none;
}
html[data-theme="light"] .input,html[data-theme="light"] .select,html[data-theme="light"] .textarea{ background:#fff; }
.input::placeholder,.textarea::placeholder{ color:var(--muted); opacity:.72; }
.input:focus,.select:focus,.textarea:focus{ outline:none; border-color:var(--green); background:var(--surface); }
.textarea{ min-height:96px; resize:vertical; line-height:1.55; }
.select{ background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23A0A7A1' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 14px center; padding-right:40px; }
.form-grid{ display:grid; gap:14px; }
@media(min-width:640px){ .form-grid.two{ grid-template-columns:1fr 1fr; } }
.check{ display:flex; align-items:flex-start; gap:11px; cursor:pointer; padding:12px 0; }
.check input{ appearance:none; width:20px; height:20px; flex:0 0 auto; border:1.5px solid var(--border); border-radius:6px; background:var(--bg2); margin:1px 0 0; position:relative; cursor:pointer; transition:.18s var(--ease); }
.check input:checked{ background:var(--green); border-color:var(--green); }
.check input:checked::after{ content:''; position:absolute; left:6px; top:2px; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(43deg); }
.check span{ font-size:.82rem; color:var(--muted); line-height:1.5; }
.field-error{ color:#E0705F; font-size:.76rem; }

/* ============================================================
   9. APP SHELL
   ============================================================ */
#app{ min-height:100dvh; display:flex; flex-direction:column; padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }
.app-header{
  position:sticky; top:0; z-index:100; background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--border-soft);
}
.header-inner{ height:var(--header-h); display:flex; align-items:center; gap:10px; }
.brand{ display:flex; align-items:center; gap:9px; min-width:0; }
.brand .mark{ width:30px; height:30px; flex:0 0 auto; }
.brand-text{ display:flex; flex-direction:column; min-width:0; }
.brand-name{ font-size:.9rem; font-weight:700; letter-spacing:-.02em; line-height:1.15; }
.brand-greet{ font-size:.71rem; color:var(--muted); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.header-actions{ margin-left:auto; display:flex; align-items:center; gap:2px; }
.cart-dot{
  position:absolute; top:4px; right:4px; min-width:17px; height:17px; padding:0 4px; border-radius:9px;
  background:var(--green); color:#fff; font-size:.63rem; font-weight:700; display:grid; place-items:center; line-height:1;
}
.avatar{
  width:32px; height:32px; border-radius:50%; background:var(--green-soft); color:var(--green);
  display:grid; place-items:center; font-size:.78rem; font-weight:700; flex:0 0 auto;
}

/* Tab bar */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:120;
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border-soft);
  display:flex; align-items:stretch;
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--muted); font-size:.63rem; font-weight:600; letter-spacing:.01em; position:relative;
  transition:color .18s var(--ease); padding:0 2px;
}
.tab svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; transition:transform .18s var(--ease); }
.tab.active{ color:var(--green); }
.tab.active svg{ transform:translateY(-1px); }
.tab .tab-badge{
  position:absolute; top:8px; left:calc(50% + 6px); min-width:16px; height:16px; padding:0 4px;
  border-radius:8px; background:var(--green); color:#fff; font-size:.6rem; font-weight:700; display:grid; place-items:center;
}
@media(min-width:900px){
  #app{ padding-bottom:0; }
  .tabbar{ position:sticky; top:0; order:-1; height:auto; border-top:0; border-bottom:1px solid var(--border-soft); padding:0; backdrop-filter:none; background:var(--bg); }
  .tabbar{ max-width:none; }
  .tabbar-wrap{ width:100%; max-width:var(--maxw); margin:0 auto; display:flex; padding:0 18px; gap:4px; }
  .tab{ flex:0 0 auto; flex-direction:row; gap:8px; height:52px; padding:0 14px; font-size:.82rem; }
  .tab .tab-badge{ position:static; margin-left:2px; }
  .tab.active{ color:var(--green); }
}

/* ============================================================
   10. SEARCH
   ============================================================ */
.searchbar{ position:relative; }
.searchbar svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:var(--muted); fill:none; stroke-width:1.8; stroke-linecap:round; pointer-events:none; }
.searchbar input{
  width:100%; height:46px; padding:0 16px 0 42px; border-radius:14px;
  background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:.88rem;
  transition:border-color .18s var(--ease);
}
.searchbar input::placeholder{ color:var(--muted); opacity:.8; }
.searchbar input:focus{ outline:none; border-color:var(--green); }

/* ============================================================
   11. BANNERS
   ============================================================ */
.event-banner{
  border:1px solid var(--border); border-radius:var(--radius); padding:15px 16px;
  background:linear-gradient(135deg, var(--green-soft), transparent 62%), var(--surface);
  display:flex; align-items:center; gap:14px;
}
.event-banner .eb-body{ min-width:0; flex:1; }
.event-banner h4{ font-size:.9rem; }
.event-banner p{ font-size:.76rem; color:var(--muted); margin-top:2px; }
.countdown{ display:flex; gap:6px; margin-top:10px; }
.countdown div{ background:var(--bg2); border:1px solid var(--border); border-radius:9px; padding:5px 9px; text-align:center; min-width:44px; }
.countdown b{ display:block; font-size:.92rem; font-weight:700; line-height:1.1; }
.countdown small{ font-size:.57rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.notice{
  display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px;
  background:var(--warn-soft); color:#DCA94B; font-size:.79rem; line-height:1.5;
}
.notice.info{ background:var(--green-soft); color:var(--green); }
.notice svg{ width:17px; height:17px; flex:0 0 auto; margin-top:1px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; }

/* ============================================================
   12. CATEGORIES
   ============================================================ */
.cat-row{ display:flex; gap:9px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; -ms-overflow-style:none; }
.cat-row::-webkit-scrollbar{ display:none; }
.cat-chip{
  flex:0 0 auto; display:flex; align-items:center; gap:8px; height:40px; padding:0 15px;
  border-radius:11px; border:1px solid var(--border); background:var(--surface);
  font-size:.81rem; font-weight:500; white-space:nowrap; transition:.18s var(--ease);
}
.cat-chip:hover{ border-color:var(--green); }
.cat-chip.active{ background:var(--green); border-color:var(--green); color:#fff; font-weight:600; }

/* ============================================================
   13. HORIZONTAL SCROLLERS
   ============================================================ */
.hscroll{ display:flex; gap:13px; overflow-x:auto; padding:2px 0 8px; scroll-snap-type:x mandatory; scrollbar-width:none; -ms-overflow-style:none; }
.hscroll::-webkit-scrollbar{ display:none; }
.hscroll > *{ scroll-snap-align:start; }

.vendor-card{
  flex:0 0 232px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
  background:var(--surface); transition:border-color .2s var(--ease), transform .14s var(--ease);
}
.vendor-card:hover{ border-color:var(--green); }
.vendor-card:active{ transform:scale(.99); }
.vc-media{ height:92px; background:var(--bg2); position:relative; overflow:hidden; }
.vc-media img{ width:100%; height:100%; object-fit:cover; }
.vc-logo{
  position:absolute; left:14px; bottom:-19px; width:44px; height:44px; border-radius:12px;
  border:2px solid var(--surface); background:var(--bg2); object-fit:cover; overflow:hidden;
  display:grid; place-items:center; font-weight:700; color:var(--green); font-size:.9rem;
}
.vc-body{ padding:25px 14px 14px; }
.vc-body h4{ font-size:.88rem; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vc-meta{ font-size:.72rem; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

/* ============================================================
   14. PRODUCT GRID
   ============================================================ */
.product-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:13px; }
@media(min-width:600px){ .product-grid{ grid-template-columns:repeat(3,1fr); } }
@media(min-width:900px){ .product-grid{ grid-template-columns:repeat(4,1fr); gap:16px; } }

.product-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; position:relative; transition:border-color .2s var(--ease), transform .14s var(--ease); display:flex; flex-direction:column; }
.product-card:hover{ border-color:color-mix(in srgb, var(--green) 55%, var(--border)); }
.product-card:active{ transform:scale(.993); }
.p-media{ aspect-ratio:1/1; background:var(--bg2); position:relative; overflow:hidden; }
.p-media img{ width:100%; height:100%; object-fit:cover; transition:transform .45s var(--ease); }
.product-card:hover .p-media img{ transform:scale(1.035); }
.p-media .ph{ width:100%; height:100%; display:grid; place-items:center; color:var(--border); }
.p-media .ph svg{ width:34px; height:34px; stroke:currentColor; fill:none; stroke-width:1.4; }
.p-save{
  position:absolute; top:8px; right:8px; width:31px; height:31px; border-radius:9px;
  background:color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter:blur(8px);
  display:grid; place-items:center; color:#fff; transition:.18s var(--ease);
}
.p-save svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linejoin:round; }
.p-save.on svg{ fill:var(--green); stroke:var(--green); }
.p-flag{
  position:absolute; top:8px; left:8px; padding:3px 8px; border-radius:7px; font-size:.62rem;
  font-weight:700; letter-spacing:.03em; text-transform:uppercase; background:var(--green); color:#fff;
}
.p-flag.pre{ background:#8A6A1E; }
.p-flag.out{ background:var(--danger); }
.p-body{ padding:11px 12px 13px; display:flex; flex-direction:column; gap:3px; flex:1; }
.p-name{ font-size:.83rem; font-weight:500; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.2em; }
.p-price{ font-size:.92rem; font-weight:700; letter-spacing:-.02em; margin-top:auto; padding-top:5px; }
.p-vendor{ font-size:.71rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ============================================================
   15. PANELS / CARDS
   ============================================================ */
.panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.panel + .panel{ margin-top:12px; }
.list{ display:flex; flex-direction:column; }
.list-item{
  display:flex; align-items:center; gap:13px; padding:14px 16px; background:var(--surface);
  border:1px solid var(--border); border-radius:14px; margin-bottom:9px; transition:border-color .18s var(--ease);
}
.list-item:hover{ border-color:color-mix(in srgb, var(--green) 45%, var(--border)); }
.list-item .li-ico{ width:36px; height:36px; border-radius:10px; background:var(--bg2); display:grid; place-items:center; flex:0 0 auto; }
.list-item .li-ico svg{ width:18px; height:18px; stroke:var(--muted); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.list-item .li-body{ flex:1; min-width:0; }
.list-item h4{ font-size:.86rem; font-weight:600; }
.list-item p{ font-size:.75rem; color:var(--muted); margin-top:1px; }
.list-item .li-arrow{ color:var(--muted); flex:0 0 auto; }

.status{ display:inline-flex; align-items:center; gap:5px; font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:.02em; text-transform:capitalize; }
.status::before{ content:''; width:5px; height:5px; border-radius:50%; background:currentColor; }
.status.approved{ background:var(--green-soft); color:#3FBF77; }
.status.pending{ background:var(--warn-soft); color:#DCA94B; }

/* Preferences persisted locally (never sensitive data) */
const PREFS_KEY = 'jalsa.prefs.v1';
function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (raw) Object.assign(state.prefs, JSON.parse(raw));
  } catch (_) {}
  applyPrefs();
}
function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(state.prefs)); } catch (_) {}
  applyPrefs();
}
function applyPrefs() {
  const root = document.documentElement;
  const t = state.prefs.theme;
  const resolved = t === 'system'
    ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : t;
  root.setAttribute('data-theme', resolved);
  root.setAttribute('data-textsize', state.prefs.textsize);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', resolved === 'light' ? '#FFFFFF' : '#101310');
}
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if (state.prefs.theme === 'system') applyPrefs();
});

/* Local preview fallback for un-configured deployments */
const LOCAL = {
  get profile() { try { return JSON.parse(localStorage.getItem('jalsa.demo.profile') || 'null'); } catch { return null; } },
  set profile(v) { localStorage.setItem('jalsa.demo.profile', JSON.stringify(v)); },
  get cart() { try { return JSON.parse(localStorage.getItem('jalsa.demo.cart') || '[]'); } catch { return []; } },
  set cart(v) { localStorage.setItem('jalsa.demo.cart', JSON.stringify(v)); },
  get saved() { try { return JSON.parse(localStorage.getItem('jalsa.demo.saved') || '[]'); } catch { return []; } },
  set saved(v) { localStorage.setItem('jalsa.demo.saved', JSON.stringify(v)); }
};

/* ------------------------------------------------------------
   4. DATA ACCESS LAYER
   ------------------------------------------------------------ */
const api = {
  /* ---- categories (public) ---- */
  async categories() {
    if (!supabase) return [];
    const { data, error } = await supabase.from('categories')
      .select('id,name,slug,sort_order').eq('is_active', true).order('sort_order');
    if (error) { console.warn(error); return []; }
    return data || [];
  },

  /* ---- events ---- */
  async activeEvent() {
    if (!supabase) return null;
    const { data } = await supabase.from('events').select('*')
      .eq('is_active', true).order('starts_on', { ascending: true }).limit(1).maybeSingle();
    return data || null;
  },
  async announcements(limit = 3) {
    if (!supabase) return [];
    const { data } = await supabase.from('announcements').select('*')
      .not('published_at', 'is', null).is('archived_at', null)
      .order('published_at', { ascending: false }).limit(limit);
    return data || [];
  },

  /* ---- products ---- */
  async products({ page = 0, size = CONFIG.PAGE_SIZE, category = null, search = '', sort = 'recent' } = {}) {
    if (!supabase) return [];
    let q = supabase.from('products')
      .select('id,name,slug,price,currency,is_available,is_preorder,created_at,vendor_id,'
        + 'vendors!inner(id,business_name,slug,status,stall_number),'
        + 'product_images(storage_path,sort_order)')
      .eq('vendors.status', 'approved')
      .range(page * size, page * size + size - 1);

    if (category) q = q.eq('category_id', category);
    if (search) q = q.ilike('name', `%${search}%`);
    q = sort === 'price_asc' ? q.order('price', { ascending: true })
      : sort === 'price_desc' ? q.order('price', { ascending: false })
      : q.order('created_at', { ascending: false });

    const { data, error } = await q;
    if (error) { console.warn(error); return []; }
    return (data || []).map(normalizeProduct);
  },

  async product(id) {
    if (!supabase) return null;
    const { data, error } = await supabase.from('products')
      .select('*, vendors!inner(id,business_name,slug,status,stall_number,whatsapp_number,'
        + 'accepts_preorders,preorder_details,collection_info,jalsa_availability),'
        + 'product_images(id,storage_path,sort_order),categories(name,slug)')
      .eq('id', id).maybeSingle();
    if (error || !data) return null;
    return normalizeProduct(data);
  },

  async vendors({ limit = 12, foodOnly = false } = {}) {
    if (!supabase) return [];
    let q = supabase.from('vendors')
      .select('id,business_name,slug,logo_path,cover_path,business_category,stall_number,'
        + 'participation_type,jalsa_availability,is_featured,categories(name)')
      .eq('status', 'approved').limit(limit);
    if (foodOnly) q = q.ilike('business_category', '%food%');
    const { data } = await q;
    return data || [];
  },

  async vendorBySlug(slug) {
    if (!supabase) return null;
    const { data } = await supabase.from('vendors').select('*')
      .eq('slug', slug).eq('status', 'approved').maybeSingle();
    return data || null;
  },

  async vendorProducts(vendorId) {
    if (!supabase) return [];
    const { data } = await supabase.from('products')
      .select('id,name,slug,price,currency,is_available,is_preorder,created_at,vendor_id,product_images(storage_path,sort_order)')
      .eq('vendor_id', vendorId).eq('is_available', true)
      .order('created_at', { ascending: false }).limit(60);
    return (data || []).map(normalizeProduct);
  },

  /* ---- saved ---- */
  async savedList() {
    if (!supabase) return LOCAL.saved;
    const { data } = await supabase.from('saved_products')
      .select('product_id, products(id,name,price,is_available,vendor_id,product_images(storage_path,sort_order),vendors(business_name,slug))')
      .order('created_at', { ascending: false });
    return (data || []).map(r => r.products).filter(Boolean).map(normalizeProduct);
  },
  async savedToggle(productId) {
    if (!supabase) {
      const list = LOCAL.saved;
      const i = list.indexOf(productId);
      i >= 0 ? list.splice(i, 1) : list.push(productId);
      LOCAL.saved = list;
      return i < 0;
    }
    const { data: existing } = await supabase.from('saved_products')
      .select('product_id').eq('product_id', productId).maybeSingle();
    if (existing) {
      await supabase.from('saved_products').delete().eq('product_id', productId);
      return false;
    }
    await supabase.from('saved_products').insert({ product_id: productId, customer_id: state.session.user.id });
    return true;
  },

  /* ---- cart ---- */
  async loadCart() {
    if (!supabase) { state.cart = LOCAL.cart; return; }
    const { data: cart } = await supabase.from('carts').select('id').maybeSingle();
    if (!cart) { state.cart = []; return; }
    const { data } = await supabase.from('cart_items')
      .select('id,quantity,price_snapshot,product_id,'
        + 'products(id,name,price,is_available,vendor_id,product_images(storage_path,sort_order),'
        + 'vendors(id,business_name,slug,whatsapp_number,stall_number,preorder_details))')
      .eq('cart_id', cart.id);
    state.cart = (data || []).filter(r => r.products).map(r => ({
      id: r.id,
      product_id: r.product_id,
      quantity: r.quantity,
      price_snapshot: r.price_snapshot,
      product: normalizeProduct(r.products),
      vendor: r.products.vendors
    }));
  },

  async addToCart(product, vendor, qty = 1) {
    if (!supabase) {
      const cart = LOCAL.cart;
      const found = cart.find(i => i.product_id === product.id);
      if (found) found.quantity += qty;
      else cart.push({ id: crypto.randomUUID(), product_id: product.id, quantity: qty, price_snapshot: product.price, product, vendor });
      LOCAL.cart = cart; state.cart = cart; return;
    }
    let { data: cart } = await supabase.from('carts').select('id').maybeSingle();
    if (!cart) {
      const ins = await supabase.from('carts').insert({ customer_id: state.session.user.id }).select('id').single();
      cart = ins.data;
    }
    const { data: existing } = await supabase.from('cart_items')
      .select('id,quantity').eq('cart_id', cart.id).eq('product_id', product.id).maybeSingle();
    if (existing) {
      await supabase.from('cart_items').update({ quantity: existing.quantity + qty }).eq('id', existing.id);
    } else {
      await supabase.from('cart_items').insert({
        cart_id: cart.id, product_id: product.id, quantity: qty, price_snapshot: product.price
      });
    }
    await api.loadCart();
  },

  async setQty(itemId, qty) {
    if (!supabase) {
      const cart = LOCAL.cart;
      const it = cart.find(i => i.id === itemId);
      if (it) { qty <= 0 ? cart.splice(cart.indexOf(it), 1) : it.quantity = qty; }
      LOCAL.cart = cart; state.cart = cart; return;
    }
    if (qty <= 0) await supabase.from('cart_items').delete().eq('id', itemId);
    else await supabase.from('cart_items').update({ quantity: qty }).eq('id', itemId);
    await api.loadCart();
  },

  /* ---- analytics ---- */
  async trackView(kind, id) {
    if (!supabase) return;
    try {
      if (kind === 'storefront') await supabase.from('storefront_views').insert({ vendor_id: id });
      if (kind === 'product') await supabase.from('product_views').insert({ product_id: id });
    } catch (_) {}
  },
  async trackWhatsApp(payload) {
    if (!supabase) return;
    try { await supabase.from('whatsapp_clicks').insert(payload); } catch (_) {}
  }
};

function normalizeProduct(p) {
  const imgs = (p.product_images || []).slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  return {
    ...p,
    images: imgs.map(i => storageUrl(i.storage_path)),
    image: imgs.length ? storageUrl(imgs[0].storage_path) : null,
    vendor_name: p.vendors?.business_name || '',
    vendor_slug: p.vendors?.slug || '',
    vendor_id: p.vendor_id || p.vendors?.id
  };
}

function storageUrl(path) {
  if (!path) return null;
  if (/^https?:/.test(path)) return path;
  if (!supabase) return null;
  const bucket = path.split('/')[0];
  const rest = path.split('/').slice(1).join('/');
  const { data } = supabase.storage.from(bucket).getPublicUrl(rest);
  return data?.publicUrl || null;
}

/* ------------------------------------------------------------
   5. AUTH
   ------------------------------------------------------------ */
async function restoreSession() {
  if (!supabase) {
    state.profile = LOCAL.profile;
    if (state.profile) await afterAuth();
    return Boolean(state.profile);
  }
  const { data } = await supabase.auth.getSession();
  state.session = data?.session || null;
  if (!state.session) return false;

  await completePendingSignup();

  const { data: prof } = await supabase.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
  if (!prof) return false;
  state.profile = prof;

  const { data: adminRow } = await supabase.from('admin_users').select('user_id').eq('user_id', state.session.user.id).maybeSingle();
  state.isAdmin = Boolean(adminRow);

  const { data: v } = await supabase.from('vendors').select('*').eq('owner_id', state.session.user.id).maybeSingle();
  state.vendor = v || null;

  await afterAuth();
  return true;
}

async function afterAuth() {
  await Promise.all([refreshCart(), refreshSaved()]);
  if (state.vendor) state.mode = 'vendor';
}

async function completePendingSignup() {
  let pending;
  try {
    pending = JSON.parse(sessionStorage.getItem('jalsa.pending.signup') || 'null');
  } catch (_) {
    return;
  }
  if (!pending || !state.session?.user?.id) return;

  const uid = state.session.user.id;

  if (pending.role === 'user') {
    const { error } = await supabase.from('profiles').upsert({
      id: uid,
      full_name: pending.fullName,
      email: pending.email,
      phone: pending.phone,
      is_vendor: false,
      marketing_consent: Boolean(pending.consent),
      consent_at: pending.consent ? new Date().toISOString() : null
    });
    if (error) throw error;

    if (pending.consent) {
      await supabase.from('user_consents').insert({
        user_id: uid,
        consent_type: 'whatsapp_marketing',
        granted: true
      });
    }
  } else {
    const { error: profileError } = await supabase.from('profiles').upsert({
      id: uid,
      full_name: pending.ownerName,
      email: pending.email,
      phone: pending.phone,
      is_vendor: true
    });
    if (profileError) throw profileError;

    const baseSlug = slugify(pending.businessName) || 'store';
    const slug = `${baseSlug}-${Math.random().toString(36).slice(2, 6)}`;
    const { error: vendorError } = await supabase.from('vendors').insert({
      owner_id: uid,
      business_name: pending.businessName,
      slug,
      business_category: pending.businessCategory,
      state: pending.state,
      district: pending.district,
      local_jamaat: pending.localJamaat,
      participation_type: pending.participationType,
      stall_number: pending.stallNumber || null,
      description: pending.description,
      whatsapp_number: pending.phone,
      status: 'pending'
    });
    if (vendorError) throw vendorError;
  }

  sessionStorage.removeItem('jalsa.pending.signup');
}

async function refreshCart() { await api.loadCart(); updateCartBadge(); }
async function refreshSaved() {
  const list = await api.savedList();
  state.saved = new Set(list.map(p => p.id));
}

async function customerSignup({ email, fullName, phone, consent }) {
  canSendAuthEmail(email);
  if (!supabase) {
    state.profile = {
      id: 'demo-user', full_name: fullName, phone,
      marketing_consent: consent, created_at: new Date().toISOString()
    };
    LOCAL.profile = state.profile;
    await afterAuth();
    return;
  }
  sessionStorage.setItem('jalsa.pending.signup', JSON.stringify({
    role: 'user', email, fullName, phone, consent
  }));
  const { error } = await supabase.auth.signInWithOtp({
    email,
    options: {
      shouldCreateUser: true,
      emailRedirectTo: `${location.origin}${location.pathname}`
    }
  });
  if (error) throw new Error(authEmailError(error));
  throw new Error('Check your email and open the confirmation link to finish creating your account.');
}

async function login(email, password) {
  if (!supabase) throw new Error('Supabase is not configured.');
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) throw new Error(error.message);
  const ok = await restoreSession();
  if (!ok) throw new Error('Signed in, but no profile was found for this account.');
}

async function loginByNameAndPhone(role, name, phone) {
  const cleanName = String(name || '').trim();
  const cleanPhone = String(phone || '').trim();
  if (!cleanName || !cleanPhone) throw new Error('Enter both your name and phone number.');

  if (!supabase) {
    if (role === 'vendor') {
      state.profile = {
        id: 'demo-vendor',
        full_name: cleanName,
        phone: cleanPhone,
        is_vendor: true
      };
      state.vendor = {
        id: 'demo-vendor-store',
        owner_id: 'demo-vendor',
        business_name: cleanName,
        slug: 'demo-store',
        status: 'approved',
        whatsapp_number: cleanPhone
      };
      LOCAL.profile = state.profile;
      state.mode = 'vendor';
      await afterAuth();
      return;
    }

    const existing = LOCAL.profile;
    state.profile = existing
      ? { ...existing, full_name: cleanName, phone: cleanPhone }
      : { id: 'demo-user', full_name: cleanName, phone: cleanPhone, created_at: new Date().toISOString() };
    LOCAL.profile = state.profile;
    state.mode = 'customer';
    await afterAuth();
    return;
  }

  if (role === 'vendor') {
    const { data, error } = await supabase.rpc('jalsa_lookup_login', {
      p_role: 'vendor',
      p_name: cleanName,
      p_phone: cleanPhone
    });
    if (error) throw new Error(error.message);
    const match = Array.isArray(data) ? data[0] : data;
    if (!match?.email) throw new Error('No vendor account matches those details.');
    canSendAuthEmail(match.email);
    const otp = await supabase.auth.signInWithOtp({
      email: match.email,
        options: {
          shouldCreateUser: false,
          emailRedirectTo: `${location.origin}${location.pathname}`
        }
    });
    if (otp.error) throw new Error(authEmailError(otp.error));
    sessionStorage.setItem('jalsa.pending.login', JSON.stringify({
      role: 'vendor',
      name: cleanName,
      phone: cleanPhone
    }));
    throw new Error('Check your email and open the confirmation link to log in.');
    return;
  }

  const { data, error } = await supabase.rpc('jalsa_lookup_login', {
    p_role: 'user',
    p_name: cleanName,
    p_phone: cleanPhone
  });
  if (error) throw new Error(error.message);
  const match = Array.isArray(data) ? data[0] : data;
  if (!match?.email) throw new Error('No user account matches those details.');
  canSendAuthEmail(match.email);
  const otp = await supabase.auth.signInWithOtp({
    email: match.email,
    options: {
      shouldCreateUser: false,
      emailRedirectTo: `${location.origin}${location.pathname}`
    }
  });
  if (otp.error) throw new Error(authEmailError(otp.error));
  sessionStorage.setItem('jalsa.pending.login', JSON.stringify({
    role: 'user',
    name: cleanName,
    phone: cleanPhone
  }));
  throw new Error('Check your email and open the confirmation link to log in.');
}

async function logout() {
  if (supabase) await supabase.auth.signOut();
  else { LOCAL.profile = null; }
  state.session = null; state.profile = null; state.vendor = null;
  state.cart = []; state.saved = new Set(); state.isAdmin = false; state.mode = 'customer';
  location.hash = '#/home';
  renderAuth();
}

/* ------------------------------------------------------------
   6. IMAGE OPTIMISATION
   ------------------------------------------------------------ */
const IMG_PRESETS = {
  product:  { maxW: 1000, maxH: 1000, targetKB: 220, bucket: 'product-images' },
  thumb:    { maxW: 400,  maxH: 400,  targetKB: 100, bucket: 'product-images' },
  logo:     { maxW: 256,  maxH: 256,  targetKB: 60,  bucket: 'vendor-logos'   },
  cover:    { maxW: 1200, maxH: 400,  targetKB: 180, bucket: 'store-covers'   }
};

async function compressImage(file, preset) {
  if (!file.type.startsWith('image/')) throw new Error('Please choose an image file.');
  if (file.size > 12 * 1024 * 1024) throw new Error('Image is larger than 12 MB.');

  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, preset.maxW / bitmap.width, preset.maxH / bitmap.height);
  const w = Math.max(1, Math.round(bitmap.width * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0, w, h);
  bitmap.close?.();

  const supportsWebp = canvas.toDataURL('image/webp').startsWith('data:image/webp');
  const mime = supportsWebp ? 'image/webp' : 'image/jpeg';
  const ext = supportsWebp ? 'webp' : 'jpg';

  let quality = 0.86;
  let blob = await new Promise(r => canvas.toBlob(r, mime, quality));
  while (blob && blob.size / 1024 > preset.targetKB && quality > 0.45) {
    quality -= 0.08;
    blob = await new Promise(r => canvas.toBlob(r, mime, quality));
  }
  if (!blob) throw new Error('Could not process this image.');
  return { blob, ext, width: w, height: h, sizeKB: Math.round(blob.size / 1024) };
}

async function uploadImage(file, preset, vendorId, onProgress) {
  if (!supabase) throw new Error('Supabase is not configured.');
  const { blob, ext, width, height, sizeKB } = await compressImage(file, preset);
  onProgress?.(30);
  const path = `${vendorId}/${crypto.randomUUID()}.${ext}`;
  const { error } = await supabase.storage.from(preset.bucket)
    .upload(path, blob, { contentType: blob.type, cacheControl: '31536000', upsert: false });
  if (error) throw new Error(error.message);
  onProgress?.(100);
  return { storagePath: `${preset.bucket}/${path}`, width, height, sizeKB };
}

/* ------------------------------------------------------------
   9. RENDER — ROUTER
   ------------------------------------------------------------ */
function parseRoute() {
  const hash = location.hash.replace(/^#/, '') || '/home';
  const parts = hash.split('/').filter(Boolean);
  return { name: parts[0] || 'home', params: { id: parts[1], section: parts[1] } };
}

async function router() {
  const r = parseRoute();
  state.route = r;

  // Admin route guard
  if (r.name === 'admin') {
    return renderAdmin(r.params.section);
  }
  if (r.name === 'privacy') return renderPrivacy();

  if (!state.profile) { renderAuth('login'); return; }

  $('#auth').classList.add('hide');
  $('#app').classList.remove('hide');
  renderHeader();
  renderTabbar();

  const view = $('#view');
  view.innerHTML = `<div class="container" style="padding:30px 0">${skeletonGrid(4)}</div>`;
  window.scrollTo({ top: 0, behavior: 'instant' });

  switch (r.name) {
    case 'home':      return renderHome();
    case 'explore':   return renderExplore();
    case 'saved':     return renderSaved();
    case 'cart':      return renderCart();
    case 'me':        return renderMe();
    case 'settings':  return renderSettings();
    case 'product':   return renderProduct(r.params.id);
    case 'store':     return renderStore(r.params.id);
    case 'vendor':    return renderVendorArea(r.params.section);
    default:          return renderHome();
  }
}

function eventBanner(ev) {
  const start = new Date(ev.starts_on + 'T00:00:00');
  const days = Math.max(0, Math.ceil((start - Date.now()) / 86400000));
  const started = days === 0;
  return `
  <div class="event-banner" style="margin-top:14px">
    <div class="eb-body">
      <h4>${esc(ev.name || 'Jalsa')} ${started ? 'is here' : 'is coming'}</h4>
      <p>${esc(new Date(ev.starts_on).toLocaleDateString('en-NG', { day: 'numeric', month: 'long' }))}
         – ${esc(new Date(ev.ends_on).toLocaleDateString('en-NG', { day: 'numeric', month: 'long', year: 'numeric' }))}</p>
      ${!started ? `<div class="countdown">
        <div><b>${days}</b><small>days</small></div>
        <div><b>${Math.floor(days / 7)}</b><small>weeks</small></div>
      </div>` : `<div class="notice info" style="margin-top:10px">${icon('clock')}<span>Vendors are open — check stall numbers and preorder details on each storefront.</span></div>`}
    </div>
  </div>`;
}

function vendorCard(v) {
  const cover = v.cover_path ? storageUrl(v.cover_path) : null;

  return `

  view.innerHTML = `
    <div class="container">
      <div style="padding:18px 0 12px">
        <div class="searchbar">
          ${icon('search')}

        </div>

          <a class="cat-chip ${cat === c.id ? 'active' : ''}" href="#/explore?cat=${esc(c.id)}&tab=${tab}&sort=${sort}">${esc(c.name)}</a>`).join('')}

        ${tab === 'products' ? `
        <select class="select" id="sort-select" style="width:auto;height:38px;padding:0 38px 0 12px;font-size:.79rem">
          <option value="recent" ${sort === 'recent' ? 'selected' : ''}>Recently added</option>
          <option value="price_asc" ${sort === 'price_asc' ? 'selected' : ''}>Price: low to high</option>
          <option value="price_desc" ${sort === 'price_desc' ? 'selected' : ''}>Price: high to low</option>
        </select>` : ''}
      </div>
      <div id="explore-results">${skeletonGrid(6)}</div>
    </div>`;

  const results = $('#explore-results');
  if (tab === 'vendors') {
    const vendors = await api.vendors({ limit: 40 });
    const filtered = q ? vendors.filter(v => v.business_name.toLowerCase().includes(q.toLowerCase())) : vendors;
    results.innerHTML = filtered.length
      ? `<div class="stack">${filtered.map(v => `
          <a class="list-item" href="#/store/${esc(v.slug)}" style="margin-bottom:0">
            <div class="li-ico" style="background:var(--green-soft);color:var(--green);font-weight:700">

            <div class="li-body">
              <h4>${esc(v.business_name)}</h4>
              <p>${esc(v.business_category || 'Vendor')}${v.stall_number ? ' · Stall ' + esc(v.stall_number) : ''}</p>
            </div>
            <span class="li-arrow">${icon('chev')}</span>
          </a>`).join('')}</div>`
      : emptyState('store', 'No vendors found', 'Try a different search term.');
  } else {
    const products = await api.products({ size: 24, category: cat || null, search: q, sort });
    results.innerHTML = products.length
      ? `<div class="product-grid">${products.map(productCard).join('')}</div>`
      : emptyState('search', 'Nothing matched', 'Try different keywords or another category.');
  }

  $('#explore-search')?.addEventListener('input', debounce((e) => {
    const val = e.target.value.trim();
    const p = new URLSearchParams(location.hash.split('?')[1] || '');
    val ? p.set('q', val) : p.delete('q');
    location.hash = `#/explore?${p.toString()}`;
  }, 450));

  $('#sort-select')?.addEventListener('change', (e) => {
    const p = new URLSearchParams(location.hash.split('?')[1] || '');
    p.set('sort', e.target.value);
    location.hash = `#/explore?${p.toString()}`;
  });
}

async function renderCart() {
  const view = $('#view');
  await refreshCart();
  const groups = new Map();
  for (const item of state.cart) {
    const vid = item.vendor?.id || item.product?.vendor_id || 'unknown';
    if (!groups.has(vid)) groups.set(vid, { vendor: item.vendor, items: [] });
    groups.get(vid).items.push(item);
  }
  const total = state.cart.reduce((s, i) => s + (i.price_snapshot || i.product?.price || 0) * i.quantity, 0);

  view.innerHTML = `
  <div class="container">
    <div style="padding:22px 0 16px">
      <h1 class="display" style="font-size:1.7rem">Your cart</h1>
      <p class="sub">${state.cart.length ? state.cart.length + ' item(s) from ' + groups.size + ' vendor(s)' : 'Add products from any vendor'}</p>
    </div>

    ${state.cart.length ? `
      ${[...groups.values()].map(g => `
        <div class="cart-group">
          <div class="cg-head">
            <div class="avatar" style="width:28px;height:28px;font-size:.68rem">${esc(initials(g.vendor?.business_name || 'V'))}</div>
            <h4>${esc(g.vendor?.business_name || 'Vendor')}</h4>
            ${g.vendor?.stall_number ? `<span class="sub" style="font-size:.72rem">Stall ${esc(g.vendor.stall_number)}</span>` : ''}
          </div>
          ${g.items.map(i => `
            <div class="cg-item">
              <div class="cg-thumb">${i.product?.image ? `<img src="${esc(i.product.image)}" alt="" loading="lazy">` : ''}</div>
              <div class="cg-info">
                <h5>${esc(i.product?.name || 'Product')}</h5>
                <div class="pr">${money(i.price_snapshot || i.product?.price)}</div>
                <div class="qty">
                  <button data-action="cart-qty" data-id="${esc(i.id)}" data-qty="${i.quantity - 1}" aria-label="Decrease">${icon('minus')}</button>
                  <span>${i.quantity}</span>
                  <button data-action="cart-qty" data-id="${esc(i.id)}" data-qty="${i.quantity + 1}" aria-label="Increase">${icon('plus')}</button>
                </div>
              </div>
              <button class="icon-btn" data-action="cart-remove" data-id="${esc(i.id)}" aria-label="Remove" style="align-self:flex-start">${icon('trash')}</button>
            </div>`).join('')}
          <div class="cg-foot">
            <span class="sub-total">Vendor subtotal <b>${money(g.items.reduce((s, i) => s + (i.price_snapshot || i.product?.price || 0) * i.quantity, 0))}</b></span>
            <button class="btn btn-primary btn-sm" data-action="checkout-vendor" data-vendor="${esc(g.vendor?.id || '')}">
              ${icon('whatsapp')} Order on WhatsApp
            </button>
          </div>
        </div>`).join('')}

      <div class="cart-summary" style="margin-top:6px">
        <div class="row-between"><span class="sub">Items</span><span>${state.cart.reduce((s, i) => s + i.quantity, 0)}</span></div>
        <div class="row-between"><span class="sub">Vendors</span><span>${groups.size}</span></div>
        <div class="row-between total"><span>Combined value</span><span>${money(total)}</span></div>
        <p class="sub" style="font-size:.72rem;margin-top:12px;line-height:1.6">
          Each vendor is contacted separately on WhatsApp. Jalsa Market does not process payments or deliveries.
        </p>
      </div>
      <button class="btn btn-ghost btn-block" style="margin-top:12px" data-action="go-explore">Continue browsing</button>
    ` : emptyState('cart', 'Your cart is empty',
        'Browse products from any vendor and add them here. You can order from several vendors at once.',

    <div style="height:30px"></div>
  </div>`;
}

/* ------------------------------------------------------------

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  /* ---- auth view switching ---- */
  if (action === 'auth-view') { e.preventDefault(); return renderAuth(el.dataset.view); }

  if (action === 'login-role') {
    e.preventDefault();
    state.loginRole = el.dataset.role === 'vendor' ? 'vendor' : 'user';
    return renderAuth('login');
  }

  if (action === 'toggle-mode') {
    e.preventDefault();
    state.mode = state.mode === 'vendor' ? 'customer' : 'vendor';
    location.hash = state.mode === 'vendor' ? '#/vendor' : '#/home';
    return;
  }

  if (action === 'go-cart') { location.hash = '#/cart'; return; }
  if (action === 'go-me')   { location.hash = '#/me'; return; }
  if (action === 'go-explore') { location.hash = '#/explore'; return; }
  if (action === 'back') { history.length > 1 ? history.back() : (location.hash = '#/home'); return; }
  if (action === 'close-sheet') { closeSheet(); return; }

  if (action === 'logout') {
    e.preventDefault();
    openSheet(`
      <h2>Log out?</h2>
      <div class="sheet-body">You will need to sign in again to access your cart, saved products and storefront.</div>
      <div class="sheet-actions">
        <button class="btn btn-danger btn-block" data-action="logout-confirm">Log out</button>
        <button class="btn btn-ghost btn-block" data-action="close-sheet">Cancel</button>
      </div>`);
    return;
  }
  if (action === 'logout-confirm') { closeSheet(); await logout(); return; }

  /* ---- saved ---- */
  if (action === 'toggle-save') {
    e.preventDefault();
    if (!state.profile) return renderAuth('login');
    try {
      const nowSaved = await api.savedToggle(el.dataset.id);
      nowSaved ? state.saved.add(el.dataset.id) : state.saved.delete(el.dataset.id);
      el.classList.toggle('on', nowSaved);
      toast(nowSaved ? 'Saved' : 'Removed from saved');
      if (state.route.name === 'saved') renderSaved();
    } catch (err) { toast(err.message, 'err'); }
    return;
  }

  /* ---- product detail ---- */
  if (action === 'thumb') {
    $('#detail-img').src = el.dataset.src;
    $$('.detail-thumbs button').forEach(b => b.classList.toggle('on', b === el));
    return;
  }
  if (action === 'qty-step') {
    const span = $('#detail-qty');
    const next = Math.max(1, Math.min(99, Number(span.textContent) + Number(el.dataset.dir)));
    span.textContent = next;
    return;
  }
  if (action === 'detail-add') {
    const qty = Number($('#detail-qty')?.textContent || 1);
    try {
      const p = await api.product(el.dataset.id);
      if (!p || p.is_available === false) throw new Error('This product is currently unavailable.');
      await api.addToCart(p, p.vendors, qty);
      updateCartBadge();
      toast(`Added ${qty} × ${p.name}`);
    } catch (err) { toast(err.message, 'err'); }
    return;
  }
  if (action === 'share-product') {
    const url = `${location.origin}${location.pathname}#/product/${el.dataset.id}`;
    return shareContent(url, el.dataset.name);
  }
  if (action === 'share-store') {
    const url = `${location.origin}${location.pathname}#/store/${el.dataset.slug}`;
    return shareContent(url, el.dataset.name);
  }
  if (action === 'copy') {
    try { await navigator.clipboard.writeText(el.dataset.text); toast('Copied'); }
    catch { toast('Could not copy', 'err'); }
    return;
  }

  /* ---- cart ---- */
  if (action === 'cart-qty') {
    try { await api.setQty(el.dataset.id, Number(el.dataset.qty)); renderCart(); updateCartBadge(); }
    catch (err) { toast(err.message, 'err'); }
    return;
  }
  if (action === 'cart-remove') {
    try { await api.setQty(el.dataset.id, 0); renderCart(); updateCartBadge(); toast('Removed'); }
    catch (err) { toast(err.message, 'err'); }
    return;
  }
  if (action === 'checkout-vendor') {
    const vendorId = el.dataset.vendor;
    const items = state.cart.filter(i => (i.vendor?.id || i.product?.vendor_id) === vendorId);
    if (!items.length) return;
    const vendor = items[0].vendor || {};
    const productIds = items.map(i => i.product_id);

    // Re-validate live prices and availability before checkout
    let fresh = [];
    try {
      const { data } = await supabase.from('products')
        .select('id,name,price,is_available').in('id', productIds);
      fresh = data || [];
    } catch (_) {}

    const unavailable = fresh.filter(f => f.is_available === false);
    if (unavailable.length) {
      toast(`${unavailable[0].name} is no longer available.`, 'err');
      return;
    }

    const lines = items.map(i => {
      const live = fresh.find(f => f.id === i.product_id);
      const price = live?.price ?? i.price_snapshot ?? i.product?.price ?? 0;
      return { name: i.product?.name || 'Product', qty: i.quantity, price, line: price * i.quantity };
    });
    const subtotal = lines.reduce((s, l) => s + l.line, 0);

    const message =
`*Jalsa Market — Order Enquiry*
${vendor.business_name || 'Vendor'}${vendor.stall_number ? ` · Stall ${vendor.stall_number}` : ''}

*Customer:* ${state.profile.full_name}
*Phone:* ${state.profile.phone || '—'}

*Items*
${lines.map((l, i) => `${i + 1}. ${l.name} × ${l.qty} — ${money(l.line)}`).join('\n')}

*Vendor subtotal:* ${money(subtotal)}
${vendor.preorder_details ? `\n*Preorder:* ${vendor.preorder_details}` : ''}
${vendor.collection_info ? `\n*Collection:* ${vendor.collection_info}` : ''}

Sent from Jalsa Market`;

    api.trackWhatsApp({
      vendor_id: vendorId,
      customer_id: state.profile.id,
      click_type: 'checkout',
      item_count: items.reduce((s, i) => s + i.quantity, 0),
      subtotal
    });

    window.open(waLink(vendor.whatsapp_number, message), '_blank', 'noopener');
    toast('Opening WhatsApp — this is an enquiry, not a confirmed order.');
    return;
  }

  /* ---- explore ---- */
  if (action === 'explore-tab') {
    const p = new URLSearchParams(location.hash.split('?')[1] || '');
    p.set('tab', el.dataset.tab);
    location.hash = `#/explore?${p.toString()}`;
    return;
  }

  /* ---- preferences ---- */
  if (action === 'set-theme')   { state.prefs.theme = el.dataset.theme; savePrefs(); renderSettings(); return; }
  if (action === 'set-textsize'){ state.prefs.textsize = el.dataset.size; savePrefs(); renderSettings(); return; }

  /* ---- vendor ---- */
  if (action === 'new-product' || action === 'edit-product') {
    return openProductEditor(el.dataset.id);
  }

  /* ---- admin ---- */
  if (action === 'admin-approve') {
    await supabase.from('vendors').update({ status: 'approved', verified_at: new Date().toISOString() }).eq('id', el.dataset.id);
    await supabase.from('vendor_verification_logs').insert({ vendor_id: el.dataset.id, action: 'approved' });
    toast('Vendor approved');
    renderAdmin('vendors');
    return;
  }
  if (action === 'admin-suspend') {
    await supabase.from('vendors').update({ status: 'suspended' }).eq('id', el.dataset.id);
    await supabase.from('vendor_verification_logs').insert({ vendor_id: el.dataset.id, action: 'suspended' });
    toast('Vendor suspended');
    renderAdmin('vendors');
    return;
  }
  if (action === 'admin-hide-product') {
    await supabase.from('products').update({ is_available: el.dataset.available !== 'true' }).eq('id', el.dataset.id);
    toast('Product updated');
    renderAdmin('products');
    return;
  }
  if (action === 'export-consented') {
    const { data } = await supabase.from('profiles')
      .select('full_name,phone,created_at').eq('marketing_consent', true);
    if (!data?.length) return toast('No consented customers yet', 'err');
    const csv = 'Name,Phone,Registered\n' +
      data.map(r => `"${(r.full_name || '').replace(/"/g, '""')}","${r.phone || ''}","${r.created_at}"`).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `jalsa-marketing-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Export downloaded');
    return;
  }
});

/* Save-sheet helper */
function shareContent(url, title) {
  if (navigator.share) {
    navigator.share({ title: title || 'Jalsa Market', url }).catch(() => {});
  } else {
    openSheet(`
      <h2>Share</h2>
      <div class="sheet-body">Send this link to a friend on WhatsApp or copy it.</div>
      <div class="sheet-actions">
        <a class="btn btn-primary btn-block" href="https://wa.me/?text=${encodeURIComponent((title || 'Jalsa Market') + ' — ' + url)}" target="_blank" rel="noopener">Share on WhatsApp</a>
        <button class="btn btn-ghost btn-block" data-action="copy" data-text="${esc(url)}">Copy link</button>
        <button class="btn btn-ghost btn-block" data-action="close-sheet">Cancel</button>
      </div>`);
  }
}

/* Product editor sheet */
async function openProductEditor(id) {
  const isEdit = Boolean(id);
  let product = null;
  if (isEdit) {
    const { data } = await supabase.from('products').select('*').eq('id', id).maybeSingle();
    product = data;
  }
  openSheet(`
    <h2>${isEdit ? 'Edit product' : 'New product'}</h2>
    <form id="form-product" class="form-grid" style="margin-top:14px">
      <div class="field"><label class="label">Product name</label>
        <input class="input" name="name" required value="${esc(product?.name || '')}"></div>
      <div class="field"><label class="label">Price (₦)</label>
        <input class="input" name="price" type="number" min="0" step="0.01" required value="${esc(product?.price || '')}"></div>
      <div class="field"><label class="label">Description</label>
        <textarea class="textarea" name="description">${esc(product?.description || '')}</textarea></div>
      <div class="field"><label class="label">Product image</label>
        <label class="upload-box" style="display:block">
          <input type="file" accept="image/*" class="sr-only" id="product-image-input">
          ${icon('camera')}<p>Tap to upload (auto-optimised)</p>
        </label>
        <div class="progress hide" id="upload-progress"><i></i></div>
      </div>
      <label class="check"><input type="checkbox" name="is_available" ${product?.is_available !== false ? 'checked' : ''}>
        <span>Available for purchase</span></label>
      <label class="check"><input type="checkbox" name="is_preorder" ${product?.is_preorder ? 'checked' : ''}>
        <span>Accepting preorders for this product</span></label>
      <div class="row" style="gap:9px">
        <button class="btn btn-primary" type="submit" style="flex:1">${isEdit ? 'Save' : 'Create'}</button>
        <button class="btn btn-ghost" type="button" data-action="close-sheet">Cancel</button>
      </div>
    </form>`);

  let uploadedPath = null;
  $('#product-image-input')?.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const bar = $('#upload-progress');
    bar.classList.remove('hide');
    try {
      const res = await uploadImage(file, IMG_PRESETS.product, state.vendor.id, (pct) => {
        bar.querySelector('i').style.width = pct + '%';
      });
      uploadedPath = res.storagePath;
      toast(`Image ready (${res.sizeKB} KB)`);
    } catch (err) { toast(err.message, 'err'); }
  });

  $('#form-product')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
      vendor_id: state.vendor.id,
      name: fd.get('name'),
      price: Number(fd.get('price')),
      description: fd.get('description') || null,
      is_available: fd.get('is_available') === 'on',
      is_preorder: fd.get('is_preorder') === 'on'
    };
    try {
      let productId = id;
      if (isEdit) {
        const { error } = await supabase.from('products').update(payload).eq('id', id);
        if (error) throw error;
      } else {
        const { data, error } = await supabase.from('products').insert(payload).select('id').single();
        if (error) throw error;
        productId = data.id;
      }
      if (uploadedPath) {
        await supabase.from('product_images').insert({
          product_id: productId, storage_path: uploadedPath, sort_order: 0
        });
      }
      closeSheet();
      toast(isEdit ? 'Product updated' : 'Product created');
      renderVendorProducts();
    } catch (err) { toast(err.message, 'err'); }
  });
}

/* ------------------------------------------------------------
   20. FORM SUBMISSIONS
   ------------------------------------------------------------ */
document.addEventListener('submit', async (e) => {
  const form = e.target;

  if (form.id === 'form-customer') {
    e.preventDefault();
    const fd = new FormData(form);
    const errEl = $('#c-error');
    errEl.classList.add('hide');
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      await customerSignup({
        email: fd.get('email').trim(),
        fullName: fd.get('full_name').trim(),
        phone: fd.get('phone').trim(),
        consent: fd.get('consent') === 'on'
      });
      location.hash = '#/home';
      await router();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hide');
    } finally { btn.disabled = false; }
    return;
  }

  if (form.id === 'form-vendor') {
    e.preventDefault();
    const fd = new FormData(form);
    const errEl = $('#v-error');
    errEl.classList.add('hide');
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      await vendorSignup(Object.fromEntries(fd.entries()));
      location.hash = '#/vendor';
      await router();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hide');
    } finally { btn.disabled = false; }
    return;
  }

  if (form.id === 'form-login') {
    e.preventDefault();
    const fd = new FormData(form);
    const errEl = $('#l-error');
    errEl.classList.add('hide');
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      await loginByNameAndPhone(
        state.loginRole,
        fd.get('name').trim(),
        fd.get('phone').trim()
      );
      location.hash = state.loginRole === 'vendor' ? '#/vendor' : '#/home';
      await router();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hide');
    } finally {
      btn.disabled = false;
    }
    return;
  }
});

document.addEventListener('change', (e) => {
  if (e.target.dataset.action === 'toggle-notify') {
    state.prefs.notify = e.target.checked;
    savePrefs();
    toast(e.target.checked ? 'Notifications on' : 'Notifications off');
  }
});

/* ------------------------------------------------------------
   21. BOOT
   ------------------------------------------------------------ */
async function boot() {
  loadPrefs();

  // Normalise /admin path → hash route
  if (/\/admin\/?$/.test(location.pathname) && !location.hash) {
    location.replace(location.pathname.replace(/\/admin\/?$/, '/') + '#/admin');
    return;
  }

  // Splash
  await new Promise(r => setTimeout(r, CONFIG.SPLASH_MS));
  $('#splash').classList.add('gone');

  // Public config (categories + event) can load without a session
  if (supabase) {
    [state.categories, state.activeEvent] = await Promise.all([api.categories(), api.activeEvent()]);
  }

  let authed = false;
  try { authed = await restoreSession(); } catch (err) { console.warn('Session restore failed', err); }

  if (authed) {
    $('#auth').classList.add('hide');
    $('#app').classList.remove('hide');
    await router();
  } else {
    renderAuth('login');
  }

  state.booted = true;

  // Service worker
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}

window.addEventListener('hashchange', () => { if (state.booted) router(); });
window.addEventListener('online', () => toast('Back online'));
window.addEventListener('offline', () => toast('You are offline — showing cached content', 'err'));

boot();
</script>
